{% load i18n %}

<div class="row w-100 common-modal-head m-0 p-0">
    <div class="col-11"><h2>{% trans 'Avantio notifications' %}</h2></div>
    <div class="col-1"><button type="button" class="btn btn-sm ark" data-bs-dismiss="modal" data-url="{% url "guest-search-by-project" %}" 
        data-target="guest-list"><i class="fas fa-times"></i></button> </div>
</div>


<div class="row m-0">
    <div class="content">
        <div id="item-list">
            {% for item in booking_list %} 
                <div class="row">
                    <div class="col-2">{% trans 'Booking code' %}</div>
                    <div class="col-4">{{item.booking_code}}</div>

                    <div class="col-2">{% trans 'Localizator' %}</div>
                    <div class="col-4">{{item.localizator}}</div>
                </div>
                <hr/>
            {% endfor %}

        </div>
    </div>
</div>

<div class="d-flex justify-content-end p-2">
    <button type="button" class="btn btn-default ark m-2" data-bs-dismiss="modal" data-url="{% url "guest-search-by-project" %}" 
        data-target="guest-list">{% trans "Close" %}</button>
</div>
