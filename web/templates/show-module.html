{% load i18n padword_tags %}


<div class="row w-100 common-modal-head m-0 p-0">
    <div class="col-11"> <h2>{{module.name}}</h2></div>
    <div class="col-1"> <button type="button" class="btn btn-sm" data-bs-dismiss="modal"><i class="fas fa-times"></i></button> </div>
</div>

<div class="row m-0"> <div class="col-12">{{module.desc|safe}} </div> </div>

{%comment%}
<div class="d-flex justify-content-end p-2">
    <button type="button" class="btn btn-primary ark m-2" data-bs-dismiss="modal" data-url="{% url "project-search" %}" 
        data-target="project-list" data-company_id="{{company_id}}">{% trans "Save" %}</button>
	<button type="button" class="btn btn-danger ark m-2" data-bs-dismiss="modal" data-url="{% url "project-remove" %}" 
        data-target="project-list" data-obj_id="{{obj.id}}" data-company_id="{{company_id}}"
    	data-confirm="{% trans "Are you sure to remove this element?" %}">{% trans "Remove" %}</button>
</div>
{%endcomment%}
