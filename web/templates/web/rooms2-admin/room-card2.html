{% load i18n padword_tags %}
<div class="card ark" data-url="{% url 'rooms2-admin-room-form' item.project_uuid %}" data-target-modal="common-modal" data-obj_id="{{ item.id }}">
    <div class="row lock-box">
        <div class="col-10 alias text-center pt-1 pb-1"><strong>{% padword_translate item.alias %}</strong></div>
        <div class="col-2 alias pt-2 text-center">
            <a class="ark" data-url="{% url 'rooms2-admin-room-remove' item.project_uuid %}" data-target="room-list"
                data-obj_id="{{ item.id }}" data-confirm="{% trans 'Are you sure to remove this element?' %}"
                title="{% trans 'Delete' %}"><i class="far fa-window-close"></i></a>
        </div>
        <div class="icons-1 d-flex justify-content-center mt-2 mb-2">
            <div class="w-25 text-center"><i class="fas fa-{{ item.state|default:'lock' }}"></i></div>
            <div class="w-50 text-center">Status</div><div class="w-25 text-center"><i class="fas fa-wifi"></i></div>
        </div>
        <div class="icons-2 d-flex justify-content-start mt-3 mb-2 pt-2">
            <div class="w-25 text-center active"><i class="fa fa-bell-slash active"></i></div><div class="w-25 text-center"><i class="fa fa-bed"></i></div>
            <div class="w-25 text-center"><i class="fa fa-broom"></i></div><div class="w-25 text-center active"><i class="fa fa-toilet-paper active"></i></div>
        </div>
    </div>
</div>
