{% load i18n %}
    <table class="table table-striped table-hover">
        <thead>
            <tr class="small small">
                <th> {% trans 'Nombre' %} </th>
                <th> {% trans 'Activo' %} </th>
                <th colspan="2"> {% trans 'UUID' %} </th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr class="small">
                <td>{{ item.name }}</td>
                <td>{% if item.active == 1 %}<i class="text-success fas fa-check-circle"></i>{% else %}<i class="text-danger fas fa-times-circle"></i>{% endif%}</td>
                <td>{{ item.uuid }}</td>
                <td class="d-flex justify-content-end">
                    <a class="me-1 btn btn-xs btn-dark" href="{% url 'projects-by-company' item.pk %}" title="{% trans 'Proyectos' %}"><i class="fas fa-project-diagram"></i></a>
                    <a class="me-1 btn btn-xs btn-dark" href="{% url 'channels-by-company' item.pk %}" title="{% trans 'Canales' %}"><i class="fas fa-comments"></i></a>
                    <a class="me-1 btn btn-xs btn-dark" href="{% url 'devices-by-company' item.pk %}" title="{% trans 'Dispositivos' %}"><i class="fas fa-tablet-alt"></i></a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <script>$('#items-counter').html('{{items|length}}');</script>
