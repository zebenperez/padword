{% load i18n padword_tags lock_tags static %}


<td><input type="checkbox" name="ch_{{item.id}}" /></td>
<td>{{ item.uuid }}</td>
<td>{% padword_translate item.alias %}</td>
<td>{{ item.project.name }}</td>
<td>{{ item.group.name }}</td>
<td>{{ item.room }}</td>
<td>{{ item.state }}</td>
<td>{{ item.charge }} %</td>
<td>{% get_wifi_icon item.gateway %}</td>
<td>{% get_wifi_icon item.wifi %} {{item.wifi}}</td>
<td class="text-end">
    <a class="me-1 btn btn-xs ark" title="{%trans "Update parameters"%}" data-url="{% url "lock-update-params" %}" data-target="row_{{item.id}}" 
        data-obj_id="{{item.id}}"><i class="fas fa-sync"></i></a>  
    <a class="me-1 btn btn-xs ark" title="{%trans "Get all passcodes"%}" data-url="{%url "lock-get-all-passcodes"%}" data-target-modal="common-modal" 
        data-obj_id="{{item.id}}"><img src="{% static "/img/ico-passcodes.png" %}"/>
    </a>  
    <a class="me-1 btn btn-xs ark" title="{%trans "Get all cards"%}" data-url="{% url "lock-get-all-cards" %}" data-target-modal="common-modal" 
        data-obj_id="{{item.id}}"><i class="fas fa-credit-card"></i></a>  
    <a class="me-1 btn btn-xs ark" title="{%trans "Get all registers"%}" data-url="{% url "lock-get-all-records" %}" data-target-modal="common-modal" 
        data-obj_id="{{item.id}}"><i class="fas fa-bars"></i></a>  
    <a class="me-1 btn btn-xs ark" title="{%trans "Edit lock"%}" data-url="{% url "lock-form" %}" data-target-modal="common-modal" 
        data-obj_id="{{item.id}}"><i class="fas fa-edit"></i></a>  
    <a class="btn btn-sm autoremove" title="{%trans "Remove lock"%}" data-model-name="web.lock" data-obj-id="{{item.id}}" 
        data-url="{% url "autoremove_obj" %}" data-target="row_{{item.id}}" data-confirm="{%trans "Are you sure to remove this element?"%}">
        <i class="fas fa-trash"></i></a>
</td>

<script> $("#main-table").trigger("update"); </script>
