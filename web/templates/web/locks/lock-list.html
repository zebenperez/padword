{% load i18n %}

<table class="table table-striped table-hover">
    <thead>
        <tr class="small small">
            <th> {% trans 'UUID' %} </th>
            <th> {% trans 'Alias' %} </th>
            <th> {% trans 'Project' %} </th>
            <th> {% trans 'Room' %} </th>
            <th> {% trans 'Status' %} </th>
            <th> {% trans 'Charge' %} </th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
            <tr class="small" id="row_{{item.id}}">
                <td>{{ item.uuid }}</td>
                <td>{{ item.alias }}</td>
                <td>{{ item.project.name }}</td>
                <td>{{ item.room }}</td>
                <td>{{ item.state }}</td>
                <td>{{ item.charge }} %</td>
                <td class="d-flex justify-content-end">
                    <a class="me-1 btn btn-xs ark" data-url="{% url "lock-form" %}" data-target-modal="common-modal" 
                        data-obj_id="{{item.id}}"><i class="fas fa-edit"></i></a>  
                    <a class="btn btn-sm autoremove" data-model-name="web.lock" data-obj-id="{{item.id}}" data-url="{% url "autoremove_obj" %}" 
                        data-target="row_{{item.id}}" data-confirm="{%trans "Are you sure to remove this element?"%}"><i class="fas fa-trash"></i></a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
<script>$('#items-counter').html('{{items|length}}');</script>
