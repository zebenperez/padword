{% extends 'base.html' %}
{% load i18n padword_tags %}

{% block second_menu %}{% get_second_menu request.user %} {% endblock second_menu %}

{% block central_content %}
    <div id="locks-content">
        <div class="content bg-transparent mt-2">
            <div class="row m-0 p-2"><div class="col-12 text-end">
                <a class="btn btn-orange ark" data-url="{% url "locks-task-add" %}" data-target="task-type" data-obj_id=""><i class="fas fa-plus"></i> {%trans "Add Task"%}</a>
            </div></div>
        </div>
        <div class="content mt-3"> 
            <div id="task-type" class="task-add"></div>
            <div id="task-params" class="task-add"></div>
            <div id="task-locks" class="task-add"></div>
            <div id="task-end" class="task-add"></div>
        </div>
        <div class="content mt-3"> {% include "web/locks-cron-by-project/task-list.html" %} </div>
    </div>
    <script> $("#main-task-table").tablesorter(); </script>
{% endblock central_content %}
