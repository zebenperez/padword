{% load i18n %}

<div class="card"><div class="card-body">
    <div class="row"><div class="col-12 text-end">
        <a class="" onclick="$('#btn-add-lock').show();$('#lock-add-details').toggle()"><i class="fas fa-times"></i></a> </div></div>

    {% if items|length == 0 %}
        {% trans "There are not lock to assign." %}
    {% else %}
        <table class="table table-striped table-hover">
            <thead>
                <tr class="small small">
                    <th> {% trans 'UUID' %} </th>
                    <th> {% trans 'Alias' %} </th>
                    <th> {% trans 'Status' %} </th>
                    <th> {% trans 'Charge' %} </th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr class="small" id="row_{{item.id}}">
                    <td>{{ item.uuid }}</td>
                    <td>{{ item.alias }}</td>
                    <td>{{ item.state }}</td>
                    <td>{{ item.charge }} %</td>
                    <td class="d-flex justify-content-end">
                        <a class="me-1 btn btn-xs ark" data-url="{% url "room-lock-add" %}" data-target="lock-list" 
                            data-obj_id="{{obj_id}}" data-lock_id="{{item.id}}"><i class="fas fa-plus"></i></a>  
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    {% endif %}
</div></div>
