{% extends 'base.html' %}
{% load i18n padword_tags %}

{% block second_menu %}{% get_second_menu request.user %} {% endblock second_menu %}

{% block central_content %}

    {% if msg and msg != "" %} <div class="alert alert-danger">{{msg}}</div> {% endif %}

    <div class="toolbar-search">
        <input type="text" class="autosearch form-control form-control-dark w-100" name="room_search_name" id="room_search_name" 
            placeholder="{% trans 'Name' %}" data-url="{% url "rooms-by-project" %}" data-target="room-list" data-related="room_search_name"
            value="{{request.session.room_search_name}}"/>
    </div>

    <div id="room-list">{% include "web/rooms/rooms-list.html" %}</div>

{% endblock central_content %}
