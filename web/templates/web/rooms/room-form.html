{% load i18n %}


<h2 class="common-modal-head">
    <div class="row">
        <div class="col-11"><h2>{% trans 'Edit room' %}</h2></div>
        <div class="col-1"><button type="button" class="btn btn-sm ark" data-bs-dismiss="modal" data-url="{% url "room-status-list" %}" 
        data-target="room-list"><i class="fas fa-times"></i></button></div>
    </div>
</h2>

<span id="div-notification"></span>

<div class="row m-0 mt-2">
    <div class="col-2 p-0">
        <div class="info-box green adm m-1 p-2">
            <span class="title">{% trans "Orden" %}</span><span class="icon"><i class="fa fa-sort"></i></span><br /><br />
            <span class="text-right"><input type="text" class="form-control input autosave" id="order" name="order" value="{{obj.order}}" title="{{obj.order}}"                           data-model-name="web.room" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/></span>
            <span id="order__msg"></span>
        </div>
    </div>
    <div class="col-2 p-0">
        <div class="info-box green adm m-1 p-2">
            <span class="title">{% trans "Alias" %}</span><span class="icon"><i class="fas fa-user"></i></span><br /><br />
            <span class="text-right"><input type="text" class="form-control autosave input" id="alias" name="alias" value="{{obj.alias}}" title="{{obj.alias}}" 
                data-model-name="web.room" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/></span>
            <span id="alias__msg"></span>
        </div>
    </div>
    <div class="col-2 p-0">
        <div class="info-box green adm m-1 p-2">
            <span class="title">{% trans "Number" %}</span><span class="icon"><i class="fas fa-bed"></i></span><br /><br />
            <span class="text-right"><input type="text" class="form-control autosave input" id="number" name="number" value="{{obj.number}}" title="{{obj.number}}" 
                  data-model-name="web.room" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/></span>
            <span id="number__msg"></span>
        </div>
    </div>
    <div class="col-4 p-0">
        <div class="info-box green adm m-1 p-2">
            <span class="title">{% trans "Project" %}</span><span class="icon"><i class="fas fa-hotel"></i></span><br /><br />
            <span class="text-right"><input type="text" class="form-control input" name="project" value="{{obj.project.name}}" readonly/></span>
        </div>
    </div>
    <div class="col-2 p-0">
        <div class="info-box green adm m-1 p-2">
            <span class="title">{% trans "Group" %}</span><span class="icon"><i class="fas fa-key"></i></span><br /><br />
            <span class="text-right">
                <select class="form-control input b-bottom ark_change" id="lock_group_uuid" name="lock_group_uuid" 
                    data-url="{% url "room-set-group" %}" data-target="div-notification" data-obj_id="{{obj.id}}"/>
                    <option value="" {%if obj.lock_group_uuid != ""%}disabled{%endif%}>{% trans "-- Select a group" %}</option>
                    {% for group in group_list %}
                        <option value="{{group.uuid}}" {%if obj.lock_group_uuid == group.uuid %}selected{%endif%}>{{group.name}}</option>
                    {% endfor %}
                </select></span>
            {%comment%}
            <select class="form-control input autosave b-bottom" id="lock_group_uuid" name="lock_group_uuid" value="{{obj.lock_group_uuid}}" 
                data-model-name="web.room" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
                <option value="">{% trans "-- Select a group" %}</option>
                {% for group in group_list %}
                    <option value="{{group.uuid}}" {%if obj.lock_group_uuid == group.uuid %}selected{%endif%}>{{group.name}}</option>
                {% endfor %}
            </select>
            {%endcomment%}
        </div>
    </div>
</div>

<div class="row justify-center pt-0 mt-3"> <div id="lock-list">{% include "web/rooms/lock-card.html" %}</div> </div>
