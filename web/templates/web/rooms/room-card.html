<div class="col-2">
    <div class="card ark"  data-url="{% url "room-form" %}" data-target-modal="common-modal" data-obj_id="{{item.id}}">
        <div class="card-body lock-box">
            <div class="col-12 text-center"><i class="fas fa-{{item.state|default:'lock'}}"></i> {{item.alias|default:'Normal'}}</div>
            <div class="col-12 text-center">Room number: <strong>{{item.number|default:'100'}}</strong></div>
            <div class="icons-1 d-flex justify-content-end mt-2">
                <div class="w-50 text-center"><i class="fa fa-bell-slash"></i></div>
                <div class="w-50 text-center"><i class="fa fa-bed"></i></div>
            </div>  
            <div class="icons-2 d-flex justify-content-end mt-3">
                <div class="w-50 text-center"><i class="fas fa-wifi"></i> </div>
                <div class="w-50 text-center"><i class="fas fa-wifi"></i> </div>  

            </div>
        </div>
    </div>
</div>
