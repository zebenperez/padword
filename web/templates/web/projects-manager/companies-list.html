{% load i18n %}


<table class="table table-striped table-hover" id="main-table">
    <thead>
        <tr class="small small">
            <th> {% trans 'Name' %} <i class="fas fa-sort"></i> </th>
            <th> {% trans 'Active' %} <i class="fas fa-sort"></i> </th>
            <th colspan="2"> {% trans 'UUID' %} </th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr class="small" id="row_{{item.id}}">
            <td>{{ item.name }}</td>
            <td>
                {% if item.active == 1 %} <i class="text-success fas fa-check-circle"></i>
                {% else %}<i class="text-danger fas fa-times-circle"></i>{% endif%}
            </td>
            <td>{{ item.uuid }}</td>
            <td class="d-flex justify-content-end">
                <a class="me-1 btn btn-xs ark" data-url="{% url "projects-manager-companies-form" %}" data-target-modal="common-modal" 
                    data-obj_id="{{item.id}}"><i class="fas fa-edit"></i></a>  
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<script>
    $("#main-table").tablesorter();
    $('#items-counter').html('{{items|length}}');
</script>
