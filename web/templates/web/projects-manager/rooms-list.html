{% load i18n padword_tags rooms_tags %}

<div class="content">
    {% for group in group_list %}
        <div class="div-rooms-content">
            <div class="locks-head">{{ group.name }} </div>
            <div class="locks-group d-flex flex-wrap pl-2">
                {% room_list project search_name group %} 
            </div>
        </div>
    {% endfor %}
    <div class="locks-group d-flex flex-wrap p-2"> {% room_list project search_name %} </div>
</div>
