{% extends 'base.html' %}
{% load i18n padword_tags %}

{% block second_menu %}{% get_second_menu request.user %} {% endblock second_menu %}

{% block central_content %}

    <div class="toolbar-search">
        <div class="row key-number p-2">
            <div class="col-6 left-k p-2">
                <div>{% trans "Card number" %}: </div>
                <div>
                    <input type="text" class="form-control input-k form-control-dark w-100 ark_change" name="number" id="number" 
                        placeholder="{% trans 'Card number' %}" data-url="{% url "keycard-number-search-by-project" %}" data-target="keycard-result"
                        onchange="setNumbers($(this))"/>
                </div>
            </div>
            <div class="col-4 offset-2 right-k p-2">
                <div class="">{% trans "Current card number" %}: </div>
                <div class="text-end"><span id="current-card"></span> </div>
            </div>
        </div>
    </div>

    <div id="keycard-result"> </div>

    <script>
        function setNumbers(obj){
            $('#current-card').html(obj.val());
            setTimeout(()=>{obj.val('')}, 200);
        }
    </script>
{% endblock central_content %}
