{% load i18n %}

<table class="table table-striped table-hover">
    <thead>
        <tr class="small small">
            <th> {% trans 'Nombre' %} </th>
            <th> {% trans 'Compañía' %} </th>
            <th> {% trans 'Activo' %} </th>
            <th> {% trans 'Dispositivos' %} </th>
            <th colspan="2"> {% trans 'UUID' %} </th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr class="small">
            <td>{{ item.name }}</td>
            <td>{{ item.company.name }}</td>
            <td>{% if item.active == 1 %}<i class="text-success fas fa-check-circle"></i>{% else %}<i class="text-danger fas fa-times-circle"></i>{% endif%}</td>
            <td>{{ item.get_devices|length }}</td>
            <td>{{ item.uuid }}</td>
            <td>
                <a class="btn btn-xs btn-dark" href="{% url 'channels' item.pk %}" title="{% trans 'Canales' %}"><i class="fas fa-comments"></i></a>
                <a class="btn btn-xs btn-dark" href="{% url 'devices-by-project' item.pk %}" title="{% trans 'Dispositivos' %}"><i class="fas fa-tablet-alt"></i></a>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<script>$('#items-counter').html('{{items|length}}');</script>
