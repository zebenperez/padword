{% load i18n %}

<h2 class="common-modal-head">{% trans 'New device' %}</h2>

<span id="div-notification"></span><br/>

<div class="row justify-center">
	<div class="col-sm-6 col-md-6 col-12">
        <label class="label">{% trans "UUID" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="uuid" name="uuid" value="{{obj.uuid}}" title="{{obj.uuid}}" 
			data-model-name="web.device" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="uuid__msg"></span>
	</div>

	<div class="col-sm-6 col-md-6 col-12">
		<label class="label">{% trans "Alias" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="alias" name="alias" value="{{obj.alias}}" title="{{obj.alias}}" 
			data-model-name="web.device" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="alias__msg"></span>
	</div>

	<div class="col-sm-6 col-md-6 col-12">
		<label class="label">{% trans "IMEI" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="imei" name="imei" value="{{obj.imei}}" title="{{obj.imei}}" 
			data-model-name="web.device" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
		<span id="imei__msg"></span>
	</div>
	
	<div class="col-sm-6 col-md-2 col-12">
		<label class="label">{% trans "Active" %}:</label>
		<select class="form-control autosave input mb-4" id="active" name="active" value="{{obj.active}}" title="{{obj.active}}" 
			data-model-name="web.device" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
		    <option value="1" {%if obj.active == 1%}selected{%endif%}>{% trans "Yes" %}</option>
		    <option value="0" {%if obj.active == 0%}selected{%endif%}>{% trans "No" %}</option>
		</select>
		<span id="active__msg"></span>
	</div>

	<div class="col-sm-6 col-md-6 col-12">
		<label class="label">{% trans "Created at" %}:</label>
		<input type="date" class="form-control autosave input mb-4" id="created_at" name="created_at" value="{{obj.created_at|date:'Y-m-d'}}" 
            title="{{obj.created_at}}" data-model-name="web.device" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/>
			<span id="created_at__msg"></span>	
	</div>
	
	<div class="col-sm-6 col-md-6 col-12">
		<label class="label">{% trans "Net type" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="net_type" name="net_type" value="{{obj.net_type}}" 
            title="{{obj.net_type}}" data-model-name="web.device" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="net_type__msg"></span>
	</div>

	<div class="col-sm-6 col-md-6 col-12">
		<label class="label">{% trans "MAC" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="mac" name="mac" value="{{obj.mac}}" title="{{obj.mac}}" 
			data-model-name="web.device" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="mac__msg"></span>
	</div>

	<div class="col-sm-6 col-md-6 col-12">
		<label class="label">{% trans "WIFI MAC" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="wifi_mac" name="wifi_mac" value="{{obj.wifi_mac}}" title="{{obj.wifi_mac}}"
			data-model-name="web.device" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="wifi_mac__msg"></span>
	</div>

	<div class="col-sm-6 col-md-6 col-12">
		<label class="label">{% trans "Room" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="room" name="room" value="{{obj.room}}" title="{{obj.room}}" 
			data-model-name="web.device" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="room__msg"></span>
	</div>

	<div class="col-sm-6 col-md-6 col-12">
		<label class="label">{% trans "Android ID padword" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="android_id_padword" name="android_id_padword" 
            value="{{obj.android_id_padword}}" title="{{obj.android_id_padword}}" data-model-name="web.device" data-obj-id="{{obj.id}}" 
            data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="android_id_padword__msg"></span>
	</div>

	<div class="col-sm-6 col-md-6 col-12">
		<label class="label">{% trans "Serial number" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="serial_number" name="serial_number" value="{{obj.serial_number}}" 
            title="{{obj.serial_number}}" data-model-name="web.device" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="serial_number__msg"></span>
	</div>

	<div class="col-sm-6 col-md-6 col-12">
		<label class="label">{% trans "Channel UUID" %}:</label>
		<select class="form-control autosave input mb-4" id="channel" name="channel" value="{{obj.channel.id}}" title="{{obj.channel.name}}" 
			data-model-name="web.device" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
		    <option value="">{% trans "-- Selecciona un proyecto" %}</option>
	    	{% for channel in channels %}
		        <option value="{{channel.id}}" {%if obj.channel == channel%}selected{%endif%}>{{channel.name}}</option>
		    {% endfor %}
		</select>
		<span id="channel__msg"></span>
	</div>
</div>		

<div class="d-flex justify-content-end p-2">
	<button type="button" class="btn btn-primary ark m-2" data-bs-dismiss="modal" data-url="{% url "device-search" %}" data-target="device-list"
         data-channel_id="{{channel_id}}" data-project_id="{{project_id}}" data-company_id="{{company_id}}">{% trans "Save" %}</button>
	<button type="button" class="btn btn-danger ark m-2" data-bs-dismiss="modal"
   		data-url="{% url "device-remove" %}" data-target="device-list" data-obj_id="{{obj.id}}" data-channel_id="{{channel_id}}" 
        data-project_id="{{project_id}}" data-company_id="{{company_id}}" data-confirm="{% trans "Are you sure to remove this element?" %}">
        {% trans "Remove" %}</button>
</div>
