{% load i18n padword_tags %}

<form method="POST" action="{% url "project-table-range" %}" id="form-range">
    {%csrf_token%}
    <input type="hidden" name="project_uuid" value="{{obj.uuid}}"/>
    <div class="row">
        <div class="col-4"> <input type="text" class="form-control" id="rname" name="name" placeholder="{% trans "Name" %}"/> </div>
        <div class="col-2"> <input type="text" class="form-control" id="ini" name="ini" placeholder="{% trans "Init value" %}"/> </div>
        <div class="col-2"> <input type="text" class="form-control" id="end" name="end" placeholder="{% trans "End value" %}"/> </div>
        <div class="col-2">
            <button class="btn btn-primary saveform" data-form="form-range" data-target="div-table-list">
                {#onclick="$('#rname').val('');$('#ini').val('');$('#end').val('')">#}
                <i class="fas fa-plus"></i> {% trans "Add range" %}</button>
        </div>
        <div class="col-2">
            <button class="btn btn-primary ark" data-url="{% url "project-table-add" %}" data-target="div-table-list" 
                data-obj_id="{{obj.id}}"> <i class="fas fa-plus"></i> {% trans "Add" %}</button>
        </div>
    </div>
</form>

<div class="row justify-center">
    {% for item in table_list %}
        {%if item.name == ""%} <div class="col-12"> {%else%} <div class="col-3"> {%endif%}
            <input type="text" class="form-control autosave input" id="name" name="name" value="{{item.name}}" placeholder="{% trans "Name" %}"
                title="{{item.name}}" data-model-name="bookings.table" data-obj-id="{{item.id}}" 
                data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="name__msg"></span>	

            <button class="btn btn-sm ark" id="btn-pos-remove" data-url="{% url "project-table-remove" %}" data-target="div-table-list" 
                data-obj_id="{{item.id}}"> <i class="fas fa-trash"></i></button>
        </div>
    {% endfor %}
</div>
