{% load i18n %}

<table class="table table-striped table-hover">
    <thead>
        <tr class="small small">
            <th class="row">
                <div class="col-6 col-md-4"> {% trans 'Name' %} </div>
                <div class="col-6 col-md-4"> {% trans 'Company' %} </div>
                <div class="col-1 d-flex d-none d-md-block"> {% trans 'Devices' %} </div>
                <div class="col-12 col-md-3 d-flex">  </div>
            </th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr class="small" id="row_{{item.id}}">
            <td class="row m-2">
                <div class="col-md-4 col-6">{% if item.active == 1 %}<i class="text-success fas fa-check-circle"></i>{% else %}<i class="text-danger fas fa-times-circle"></i>{% endif%}&nbsp;{{ item.name }}</div>
                <div class="col-md-4 col-6">{{ item.company.name }}</div>
                <div class="col-1 d-flex d-none d-md-block justify-content-center">{{ item.get_devices | length }}</div>
                <div class="col-md-3 pt-md-0 pt-3 col-12 d-flex justify-content-md-end justify-content-center">
                    <a class="btn" href="#" onclick='alert("{{item.uuid}}"); return False'><i class="fas fa-fingerprint"></i></a>
                    <a class="btn btn-xs" href="{% url 'channels-by-project' item.pk %}" title="{% trans 'Channels' %}">
                        <i class="fas fa-comments"></i></a>
                    <a class="btn btn-xs" href="{% url 'devices-by-project' item.pk %}" title="{% trans 'Devices' %}">
                        <i class="fas fa-tablet-alt"></i></a>
                    {% if item.uuid %}
                    <a class="btn btn-xs" href="{% url 'categories-by-project' item.uuid %}" title="{% trans 'Categories' %}">
                        <i class="fas fa-project-diagram"></i></a>
                    {% endif %}
                    <a class="btn btn-xs ark" data-url="{% url "project-upload-json" %}" data-target-modal="common-modal" 
                        data-obj_id="{{item.id}}" data-company_id="{{company.id}}"><i class="fas fa-upload"></i></a>  
                    <a class="btn btn-xs" href="{% url 'bookings-by-project' item.pk %}" title="{% trans 'Bookings' %}"> <i class="fas fa-list"></i></a>
                    <a class="btn btn-xs ark" data-url="{% url "project-form" %}" data-target-modal="common-modal" 
                        data-obj_id="{{item.id}}" data-company_id="{{company.id}}"><i class="fas fa-edit"></i></a>  
                    <a class="btn btn-sm autoremove" data-model-name="web.project" data-obj-id="{{item.id}}" data-url="{% url "autoremove_obj" %}" 
                        data-target="row_{{item.id}}" data-confirm="{% trans "Are you sure to remove this element?" %}"
                        data-company_id="{{company.id}}"><i class="fas fa-trash"></i></a>
                </div>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<script>$('#items-counter').html('{{items|length}}');</script>
