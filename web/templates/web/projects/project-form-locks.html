{% load i18n padword_tags %}


<div class="row justify-center">
    <div class="col-6"> <label class="label">{% trans "TTLock Username" %}:</label> </div>
    <div class="col-6"> <label class="label">{% trans "TTLock Password" %}:</label> </div>
</div>
<div class="row justify-center mb-4">
    <div class="col-6">
        <input type="text" class="form-control autosave input" id="username" name="username" value="{{user_lock.username}}"
            title="{{user_lock.username}}" data-model-name="web.projectlockuser" data-obj-id="{{user_lock.id}}"
            data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="lock_username__msg"></span>
    </div>
    <div class="col-6">
        <input type="text" class="form-control autosave input" id="password" name="password" value="{{user_lock.password}}"
            title="{{user_lock.password}}" data-model-name="web.projectlockuser" data-obj-id="{{user_lock.id}}"
            data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="lock_password__msg"></span>
    </div>
</div>

<span id="span-token">{% include "web/projects/project-token.html" %}</span>

<div class="row g-3 mt-4">
    <div class="col-md-3">
        <label class="label d-block">Activar planificador:</label>
        <div class="form-check form-switch">
            <input class="form-check-input toggleCronLock" type="checkbox" id="activeCron" data-class-name="lock-cron"
                data-field="btn-time" data-field-time="time" {% if user_lock.time_schedule_tasks != '-1' %} checked {% endif %}>
        </div>
    </div>
    <div class="col-md-4">
        <label class="label">{% trans "Time to execute tasks" %}:</label>
        <div class="input-group">
            <input type="time" class="form-control input lock-cron" id="time" name="time" value="{{user_lock.time_schedule_tasks}}"
                onchange="$('#btn-time').data('time', $(this).val())"/>
            <a id="btn-time" class="btn btn-sm ark input-group-text" data-url="{%url "project-set-lock-schedule"%}" data-target="" data-time=""
                data-obj_id="{{user_lock.id}}" data-project_uuid="{{obj.uuid}}"> <i class="fas fa-chevron-right"></i></a>
        </div>
    </div>
    <div class="col-md-5">
        <label class="label">{% trans "Report email" %}:</label>
        <input type="text" class="form-control autosave input lock-cron" id="report_email" name="report_email" 
            value="{{user_lock.report_email}}" title="{{user_lock.report_email}}" data-model-name="web.projectlockuser" 
            data-obj-id="{{user_lock.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/> 
        <span id="report_email__msg"></span>
    </div>
</div>

<div class="row justify-center m-0 p-0">
    <div class="col-12 d-flex justify-content-end">
        {% for lang in obj.get_languages %}
            <a class="btn btn-{% is_current_lang lang 'primary' 'secondary'%} ms-2 me-2 pointer" 
                href="{% url "project-details" obj.id "locks" %}?lang={{lang}}"> {{lang}}</a>
        {%endfor%}
    </div>

    <div class="col-12">
        <label class="label">{% trans "Text to share" %}:</label>
        <textarea class="form-control autosave input mb-4" id="text_to_share" name="text_to_share" rows="10" 
            data-lang="{% current_lang %}" title="{{user_lock.text_to_share}}" data-model-name="web.projectlockuser" 
            data-obj-id="{{user_lock.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification">
            {% padword_translate user_lock.text_to_share %}</textarea> <span id="lock_username__msg"></span>	
    </div>
</div>
