{% load i18n padword_tags %}

<h2 class="common-modal-head">{% trans 'New proyect' %}</h2>


<span id="div-notification"></span><br/>

<div class="row justify-center">
	<div class="col-md-3 col-12">
        <label class="label">{% trans "Name" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="name" name="name" value="{{obj.name}}" title="{{obj.name}}" 
			data-model-name="web.project" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="name__msg"></span>
	</div>

	<div class="col-md-3 col-12">
        <label class="label">{% trans "Company" %}:</label>
		<select class="form-control autosave input mb-4" id="company" name="company" value="{{obj.company.id}}" title="{{obj.company.name}}" 
			data-model-name="web.project" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
		    <option value="">{% trans "-- Select a company" %}</option>
	    	{% for comp in companies %}
		        <option value="{{comp.id}}" {%if obj.company == comp%}selected{%endif%}>{{comp.name}}</option>
		    {% endfor %}
		</select>
		<span id="active__msg"></span>
	</div>
	
    <div class="col-md-2 col-12">
        <label class="label">{% trans "Prefix" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="prefix" name="prefix" value="{{obj.prefix}}" title="{{obj.prefix}}" 
			data-model-name="web.project" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="prefix__msg"></span>
	</div>

	<div class="col-md-2 col-12">
		<label class="label">{% trans "Active" %}:</label>

		<select class="form-control autosave input mb-4" id="active" name="active" value="{{obj.active}}" title="{{obj.active}}" 
			data-model-name="web.project" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
		    <option value="1" {%if obj.active == 1%}selected{%endif%}>{% trans "Yes" %}</option>
		    <option value="0" {%if obj.active == 0%}selected{%endif%}>{% trans "No" %}</option>
		</select>
		<span id="active__msg"></span>
	</div>

	<div class="col-md-2 col-12">
		<label class="label">{% trans "Time zone" %}:</label>

		<input type="text" class="form-control autosave input mb-4" id="time_zone" name="time_zone" value="{{obj.time_zone}}" 
            title="{{obj.time_zone}}" data-model-name="web.project" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}"
            data-target="div-notification"/> <span id="time_zone__msg"></span>
	</div>
</div>

<div class="row justify-center">
	<div class="col-md-2 col-12">
		<label class="label">{% trans "Created at" %}:</label>
		<input type="date" class="form-control autosave input mb-4" id="created_at" name="created_at" value="{{obj.created_at|date:'Y-m-d'}}" title="{{obj.created_at}}" 
			data-model-name="web.project" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="created_at__msg"></span>	
	</div>

	<div class="col-md-5 col-12">
        {#<label class="label">{% trans "Used Languages (code separated by colons)" %}:</label>#}
        <label class="label">{% trans "Languages" %}:</label>
        <input type="input" class="form-control autosave input mb-4" id="used_languates" name="used_languages" value="{{obj.used_languages}}" title={% trans 'Languages in project' %}"" 
			data-model-name="web.project" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="used_languages__msg"></span>	
	</div>
	
	<div class="col-md-5 col-12">
		<label class="label">{% trans "UUID" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="uuid" name="uuid" value="{{obj.uuid}}" title="{{obj.uuid}}" 
			data-model-name="web.project" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification" readonly/>
			<span id="uuid__msg"></span>
	</div>
</div>		


<h2 class="common-modal-head">{% trans 'Locks' %}</h2>
<div class="row justify-center">
	<div class="col-4">
		<label class="label">{% trans "TTLock Username" %}:</label>
		<input type="text" class="form-control autosave input" id="username" name="username" value="{{user_lock.username}}" 
            title="{{user_lock.username}}" data-model-name="web.projectlockuser" data-obj-id="{{user_lock.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="lock_username__msg"></span>	
	</div>
	<div class="col-4">
		<label class="label">{% trans "TTLock Password" %}:</label>
        <input type="text" class="form-control autosave input" id="password" name="password" value="{{user_lock.password}}" 
            title="{{user_lock.password}}" data-model-name="web.projectlockuser" data-obj-id="{{user_lock.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="lock_password__msg"></span>	
	</div>
	<div class="col-2 mt-4">
        <a class="btn btn-primary pointer ark" data-url="{% url "project-user-token" %}" data-target="span-token" data-obj_id="{{user_lock.id}}">
            {% trans "Get token" %}</a>
	</div>
	<div class="col-2 mt-4">
        <a class="btn btn-primary pointer ark" data-url="{% url "project-user-refresh-token" %}" data-target="span-token" 
            data-obj_id="{{user_lock.id}}"> {% trans "Refresh token" %}</a>
	</div>
</div>		

<span id="span-token">{% include "web/projects/project-token.html" %}</span>

<div class="row justify-center m-0 p-0">
    <div class="col-12 d-flex justify-content-end">
        {% for lang in obj.get_languages %}
            <a class="btn btn-{% is_current_lang lang 'primary' 'secondary'%} ark ms-2 me-2 pointer" data-url="{% url "project-form" %}" 
                data-target-modal="common-modal" data-lang="{{lang}}" data-obj_id="{{obj.id}}">{{lang}}</a>
        {%endfor%}
    </div>

	<div class="col-12">
		<label class="label">{% trans "Text to share" %}:</label>
		<textarea class="form-control autosave input mb-4" id="text_to_share" name="text_to_share" data-lang="{% current_lang %}"
            title="{{user_lock.text_to_share}}" data-model-name="web.projectlockuser" data-obj-id="{{user_lock.id}}" 
            data-url="{% url "autosave_field" %}" data-target="div-notification">{% padword_translate user_lock.text_to_share %}</textarea> 
        <span id="lock_username__msg"></span>	
	</div>
</div>


<div class="d-flex justify-content-end p-2">
    <button type="button" class="btn btn-primary ark m-2" data-bs-dismiss="modal" data-url="{% url "project-search" %}" 
        data-target="project-list" data-company_id="{{company_id}}">{% trans "Save" %}</button>
	<button type="button" class="btn btn-danger ark m-2" data-bs-dismiss="modal" data-url="{% url "project-remove" %}" 
        data-target="project-list" data-obj_id="{{obj.id}}" data-company_id="{{company_id}}"
    	data-confirm="{% trans "Are you sure to remove this element?" %}">{% trans "Remove" %}</button>
</div>
