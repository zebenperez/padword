{% load i18n padword_tags %}


<div class="card mt-2">
    <div class="card-header toggle-btn" data-target="body-stripe" data-id-change="icon-extra"
        data-text='<i class="fas fa-plus"></i>' data-text-alt='<i class="fas fa-minus"></i>'>
        <div class="row w-100">
            <div class="col-6 text-right" id="icon-extra"><i class="fas fa-plus"></i></div>
            <div class="col-6 text-left"><strong>{% trans "Stripe" %}</strong></div>
        </div>
    </div>
    <div class="card-body hide" id="body-stripe"> 
        <div class="row justify-center">
            <div class="col-md-4 col-12">
                <label class="label">{% trans "API KEY" %}:</label>
                <input type="text" class="form-control autosave input" id="api_key" name="api_key" value="{{user_stripe.api_key}}" 
                    title="{{user_stripe.username}}" data-model-name="connector.projectstripeuser" data-obj-id="{{user_stripe.id}}" 
                    data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="api_key__msg"></span>	
            </div>
        </div>		
    </div>		
</div>
