{% load i18n padword_tags %}


<div class="card mt-2">
    <div class="card-header toggle-btn bg-success av-cron-head" data-target="body-avantio" data-id-change="icon-extra"
        data-text='<i class="fas fa-plus"></i>' data-text-alt='<i class="fas fa-minus"></i>'>
        <div class="row w-100">
            <div class="col-6 text-right" id="icon-extra"><i class="fas fa-plus"></i></div>
            <div class="col-6 text-left"><strong>{% trans "Avantio" %}</strong></div>
        </div>
    </div>
    <div class="card-body hide" id="body-avantio"> 
        <div class="row justify-center">
            <div class="col-3 offset-9">
                <div class="form-check form-switch">
                    <input class="form-check-input toggleCron" type="checkbox" id="activeCronAv" data-class-name="av-cron" 
                        data-fields="av-hour,av-hour_notif" {% if user_avantio.hour != -1 %} checked {% endif %}>
                    <label class="form-check-label" for="activeCronAv">Activar planificador</label>
                </div>
            </div>
            <br/> <br/>
            <div class="col-12">
                <label class="label">{% trans "Nombre de usuario para acceder a la API" %}:</label>
                <input type="text" class="form-control autosave input av-cron" id="username" name="username" value="{{user_avantio.username}}" 
                    title="{{user_avantio.username}}" data-model-name="connector.projectavantiouser" data-obj-id="{{user_avantio.id}}" 
                    data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="username__msg"></span>	
            </div>
            <div class="col-12">
                <label class="label">{% trans "Contraseña para acceder a la API" %}:</label>
                <input type="text" class="form-control autosave input av-cron" id="password" name="password" value="{{user_avantio.password}}" 
                    title="{{user_avantio.password}}" data-model-name="connector.projectavantiouser" data-obj-id="{{user_avantio.id}}" 
                    data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="password__msg"></span>	
            </div>
            <div class="col-12">
                <label class="label">{% trans "Correo electrónico" %}:</label>
                <input type="text" class="form-control autosave input av-cron" id="email" name="email" value="{{user_avantio.email}}" 
                    title="{{user_avantio.email}}" data-model-name="connector.projectavantiouser" data-obj-id="{{user_avantio.id}}" 
                    data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="email__msg"></span>	
            </div>
            <div class="col-6">
                <label class="label">{% trans "Dias para importar las reservas" %} 
                    <br/>{% trans "(todas entre hoy y el número de días indicado)" %}:</label>
                <input type="text" class="form-control autosave input text-center av-cron" id="days" name="days" value="{{user_avantio.days}}" 
                    title="{{user_avantio.days}}" data-model-name="connector.projectavantiouser" data-obj-id="{{user_avantio.id}}" 
                    data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="days__msg"></span>	
            </div>
            <div class="col-6">
                <label class="label">{% trans "Días para crear las reservas" %}
                    <br/>{% trans "(se crean aquellas que empiezan entre hoy y el número de días indicado)" %}:</label>
                <input type="text" class="form-control autosave input text-center av-cron" id="days_new" name="days_new" 
                    value="{{user_avantio.days_new}}" title="{{user_avantio.days_new}}" data-model-name="connector.projectavantiouser" 
                    data-obj-id="{{user_avantio.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/> 
                    <span id="days_new__msg"></span>	
            </div>
            <div class="col-6">
                <label class="label">{% trans "Hora a la que se realiza la importación" %}
                    <br/>{% trans "(P.E.: si el valor es '13' se importaría a las 13 horas)" %}:</label>
                <input type="text" class="form-control input ark_change text-center av-cron av-hour" id="hour" name="hour" 
                    value="{{user_avantio.hour}}" title="{{user_avantio.hour}}" data-url="{% url "project-set-avantio-schedule" %}" 
                    data-target="div-notification" data-obj_id="{{user_avantio.id}}" data-field="hour"/> <span id="hour__msg"></span>	
            </div>
            <div class="col-6">
                <label class="label">{% trans "Minutos a los que se realiza la importación" %}
                    <br/> {% trans "(P.E.: si el valor es '30' se importaría a la hora indicada en el minuto 30)" %}:</label>
                <input type="text" class="form-control input ark_change text-center av-cron" id="minute" name="minute" 
                    value="{{user_avantio.minute}}" title="{{user_avantio.minute}}" data-url="{% url "project-set-avantio-schedule" %}" 
                    data-target="div-notification" data-obj_id="{{user_avantio.id}}" data-field="minute"/> <span id="minute__msg"></span>	
            </div>
            <div class="col-6">
                <label class="label">{% trans "Número de horas para revisar notificaciones" %}
                    <br/>{% trans "(P.E.: si el valor es '1' se comprueban las notificaciones cada hora)" %}:</label>
                <input type="text" class="form-control input ark_change text-center av-cron av-hour_notif" id="hour_notif" name="hour_notif" 
                    value="{{user_avantio.hour_notif}}" title="{{user_avantio.hour_notif}}" data-url="{% url "project-set-avantio-schedule" %}" 
                    data-target="div-notification" data-obj_id="{{user_avantio.id}}" data-field="hour_notif"/> <span id="hour_notif__msg"></span>	
            </div>
            <div class="col-6">
                <label class="label">
                    {% trans "Si está activo el código asignado a las cerraduras serán los últimos 4 dígitos del teléfono indicado en la reserva" %}:
                </label>
                <input type="checkbox" class="form-control- autosave input av-cron" id="code_mobile" name="code_mobile" 
                    value="{{user_avantio.code_mobile}}" title="{{user_avantio.code_mobile}}" data-model-name="connector.projectavantiouser" 
                    data-obj-id="{{user_avantio.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification" data-bool="True"
                    {%if user_avantio.code_mobile%}checked{%endif%}/> <span id="days_new__msg"></span>	
            </div>
        </div>		
    </div>		
</div>		
<script> checkCronEnable("{{user_avantio.hour}}", "av-cron"); </script>
