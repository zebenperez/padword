{% load i18n padword_tags %}


{% for item in point_of_sale_list %}
    <div class="row justify-center">
        <div class="col-5">
            <label class="label">{% trans "Name" %}:</label>
            <input type="text" class="form-control autosave input" id="name" name="name" value="{{item.name}}" 
                title="{{item.name}}" data-model-name="contents.pointofsale" data-obj-id="{{item.id}}" 
                data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="name__msg"></span>	
        </div>
        <div class="col-5">
            <label class="label">{% trans "UUID" %}:</label>
            <input type="text" class="form-control autosave input" id="uuid" name="uuid" value="{{item.uuid}}" 
                title="{{item.uuid}}" data-model-name="contents.pointofsale" data-obj-id="{{item.id}}" 
                data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="uuid__msg"></span>	
        </div>
        <div class="col-2">
            <button class="btn btn-sm ark" id="btn-pos-remove" data-url="{% url "project-pos-remove" %}" data-target="div-pos-list" 
                data-obj_id="{{item.id}}"> <i class="fas fa-trash"></i></button>
        </div>
    </div>		

    <div class="row justify-center">
        <h5>{% trans "Categories" %}</h5>
        {% for cat in form.get_category.get_active_childrens %}
            <div class="col-2">
                <button class="btn {%if cat in item.get_categories%}btn-primary-active{%else%}btn-outline-primary{%endif%} ark" 
                    data-url="{% url "project-pos-cat-toggle" %}" data-target="" data-obj_id="{{item.id}}" data-category_id="{{cat.id}}"
                    onclick="$(this).toggleClass('btn-outline-primary btn-primary-active')">{% padword_translate cat.name %}</button>
            </div>
        {% endfor %}
    </div>

    <div class="row justify-center">
        <h5>{% trans "Tables" %}</h5>
        <div id="div-table-{{item.id}}">{% include "web/projects/project-form-table-list.html" %}</div>
    </div>

{% endfor %}
