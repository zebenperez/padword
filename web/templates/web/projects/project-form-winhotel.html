{% load i18n padword_tags %}


<div class="card">
    <div class="card-header toggle-btn" data-target="body-winhotel" data-id-change="icon-extra"
        data-text='<i class="fas fa-plus"></i>' data-text-alt='<i class="fas fa-minus"></i>'>
        <div class="row w-100">
            <div class="col-6 text-right" id="icon-extra"><i class="fas fa-plus"></i></div>
            <div class="col-6 text-left"><strong>{% trans "Winhotel" %}</strong></div>
        </div>
    </div>
    <div class="card-body hide" id="body-winhotel"> 
        <div class="row justify-center">
            <div class="col-6">
                <label class="label">{% trans "Hotel Source Code" %}:</label>
                <input type="text" class="form-control autosave input" id="source_code" name="source_code" value="{{user_winhotel.source_code}}" 
                    title="{{user_winhotel.source_code}}" data-model-name="connector.projectwinhoteluser" data-obj-id="{{user_winhotel.id}}" 
                    data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="source_code__msg"></span>	
            </div>
            <div class="col-6">
                <label class="label">{% trans "Hotel Target Code" %}:</label>
                <input type="text" class="form-control autosave input" id="target_code" name="target_code" value="{{user_winhotel.target_code}}" 
                    title="{{user_winhotel.target_code}}" data-model-name="connector.projectwinhoteluser" data-obj-id="{{user_winhotel.id}}" 
                    data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="target_code__msg"></span>	
            </div>
        </div>		
    </div>		
</div>
