{% load i18n padword_tags %}


<div class="card mt-2">
    <div class="card-header toggle-btn bg-success wh-cron-head" data-target="body-winhotel" data-id-change="icon-extra-w"
        data-text='<i class="fas fa-plus"></i>' data-text-alt='<i class="fas fa-minus"></i>'>
        <div class="row w-100">
            <div class="col-6 text-right" id="icon-extra-w"><i class="fas fa-plus"></i></div>
            <div class="col-6 text-left"><strong>{% trans "Winhotel" %}</strong></div>
        </div>
    </div>
    <div class="card-body hide" id="body-winhotel"> 
        <div class="row justify-center">
            <div class="col-3 offset-9">
                <div class="form-check form-switch">
                    <input class="form-check-input toggleCron" type="checkbox" id="activeCron" data-class-name="wh-cron" 
                        data-fields="wh-hour,wh-minute,wh-hour_price,wh-hour_cancel" {% if user_winhotel.hour != -1 %} checked {% endif %}>
                    <label class="form-check-label" for="activeCron">Activar planificador</label>
                </div>
            </div>
            <br/> <br/>
            <div class="col-12">
                <label class="label">{% trans "Código de origen del hotel en Winhotel (Source)" %}:</label>
                <input type="text" class="form-control autosave input wh-cron" id="source_code" name="source_code" 
                    value="{{user_winhotel.source_code}}" title="{{user_winhotel.source_code}}" data-model-name="connector.projectwinhoteluser" 
                    data-obj-id="{{user_winhotel.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/> 
                    <span id="source_code__msg"></span>	
            </div>
            <div class="col-12">
                <label class="label">{% trans "Código de destino del hotel en Winhotel (Target)" %}:</label>
                <input type="text" class="form-control autosave input wh-cron" id="target_code" name="target_code" 
                    value="{{user_winhotel.target_code}}" title="{{user_winhotel.target_code}}" data-model-name="connector.projectwinhoteluser" 
                    data-obj-id="{{user_winhotel.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/> 
                    <span id="target_code__msg"></span>	
            </div>
            <div class="col-12">
                <label class="label">
                    {% trans "Si esta activo se actualizan todos los precios asociados al producto, si no solo se actualiza el principal" %}:
                </label>
                <input type="checkbox" class="autosave input" id="update_all_prices wh-cron" name="update_all_prices" data-bool="True"
                    data-model-name="connector.projectwinhoteluser" data-obj-id="{{user_winhotel.id}}" data-url="{% url "autosave_field" %}" 
                    data-target="div-notification" {%if user_winhotel.update_all_prices%}checked{%endif%}/> <span id="update_all_prices__msg"></span>
            </div>
        </div>
        <div class="row justify-center">
            <div class="col-12">
                <label class="label">{% trans "URL del FTP desde donde descargar la actualización de precios" %}:</label>
                <input type="text" class="form-control autosave input wh-cron" id="ftp" name="ftp" value="{{user_winhotel.ftp}}" 
                    title="{{user_winhotel.ftp}}" data-model-name="connector.projectwinhoteluser" data-obj-id="{{user_winhotel.id}}" 
                    data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="ftp__msg"></span>	
            </div>
            <div class="col-12">
                <label class="label">{% trans "Nombre del fichero con la actualización de precios" %}:</label>
                <input type="text" class="form-control autosave input wh-cron" id="ftp_filename" name="ftp_filename" 
                    value="{{user_winhotel.ftp_filename}}" title="{{user_winhotel.ftp_filename}}" data-model-name="connector.projectwinhoteluser" 
                    data-obj-id="{{user_winhotel.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/> 
                    <span id="ftp_filename__msg"></span>	
            </div>
        </div>

        <div class="row justify-center">
            <div class="col-6">
                <label class="label">{% trans "Días para crear las reservas" %}
                    <br/>{% trans "(se crean aquellas que empiezan entre hoy y el número de días indicado)" %}:</label>
                <input type="text" class="form-control autosave input text-center wh-cron" id="days" name="days" value="{{user_winhotel.days}}" 
                    title="{{user_winhotel.days}}" data-model-name="connector.projectwinhoteluser" data-obj-id="{{user_winhotel.id}}" 
                    data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="days__msg"></span>	
            </div>
            <div class="col-6">
                <label class="label">{% trans "Número de horas para importar las reservas" %}
                    <br/>{% trans "(P.E.: si el valor es '1' se importan las reservas cada hora)" %}:</label>
                <input type="text" class="form-control input ark_change text-center wh-cron wh-hour" id="hour" name="hour" 
                    value="{{user_winhotel.hour}}" title="{{user_winhotel.hour}}" data-url="{% url "project-set-winhotel-schedule" %}" 
                    data-target="div-notification" data-obj_id="{{user_winhotel.id}}" data-field="hour"/> <span id="hour__msg"></span>	
            </div>
            <div class="col-6">
                <label class="label">{% trans "Número de minutos para revisar actualizaciones" %}
                    <br/>{% trans "(P.E.: si el valor es '30' se comprueban las actualizaciones cada 30 minutos)" %}:</label>
                <input type="text" class="form-control input ark_change text-center wh-cron wh-minute" id="minute" name="minute" 
                    value="{{user_winhotel.minute}}" title="{{user_winhotel.minute}}" data-url="{% url "project-set-winhotel-schedule" %}" 
                    data-target="div-notification" data-obj_id="{{user_winhotel.id}}" data-field="minute"/> <span id="minute__msg"></span>	
            </div>
            <div class="col-6">
                <label class="label">{% trans "Número de horas para importar la lista de precios" %}
                    <br/>{% trans "(P.E.: si el valor es '1' se importan la lista de precios cada hora)" %}:</label>
                <input type="text" class="form-control input ark_change text-center wh-cron wh-hour_price" id="hour_price" name="hour_price" 
                    value="{{user_winhotel.hour_price}}" title="{{user_winhotel.hour_price}}" data-url="{% url "project-set-winhotel-schedule" %}" 
                    data-target="div-notification" data-obj_id="{{user_winhotel.id}}" data-field="hour_price"/> <span id="hour_price__msg"></span>	
            </div>
            <div class="col-6">
                <label class="label">{% trans "Número de horas para cancelar reservas" %}
                    <br/>{% trans "(P.E.: si el valor es '1' se cancelaran reservas cada hora)" %}:</label>
                <input type="text" class="form-control input ark_change text-center wh-cron wh-hour_cancel" id="hour_cancel" name="hour_cancel" 
                    value="{{user_winhotel.hour_cancel}}" title="{{user_winhotel.hour_cancel}}" data-url="{% url "project-set-winhotel-schedule" %}" 
                    data-target="div-notification" data-obj_id="{{user_winhotel.id}}" data-field="hour_cancel"/> <span id="hour_cancel__msg"></span>
            </div>
            <div class="col-6">
                <label class="label">{% trans "Operador de winhotel utilizado para las fechas" %}
                    <br/>{% trans "(0: igual a la fecha indicada, 1: mayor o igual a la fecha indicada, 2: mayor a la fecha indicada, "%}
                    {% trans "3: menor a la fecha indicada, 4: menor o igual a la fecha indicada, 5: distinto a la fecha indicada)"%}:</label>
                <input type="text" class="form-control autosave input text-center wh-cron" id="import_operator" name="import_operator" 
                    value="{{user_winhotel.import_operator}}" title="{{user_winhotel.import_operator}}" 
                    data-model-name="connector.projectwinhoteluser" data-obj-id="{{user_winhotel.id}}" data-url="{% url "autosave_field" %}" 
                    data-target="div-notification"/> <span id="import_operator__msg"></span>	
            </div>
        </div>		

        <hr/>
        <form method="POST" action="{% url "winhotel-get-day-booking-list" %}" id="form-get" />
            {%csrf_token%}
            <input type="hidden" name="obj_id" value="{{user_winhotel.id}}"/>
            <div class="row mt-3" style="--bs-gutter-x: 0rem;">
                <div class="col-3">
                    <label class="label">{% trans "Hotel Source Code" %}:</label>
                    <input type="text" class="form-control input" id="source" name="source" />
                </div>
                <div class="col-3">
                    <label class="label">{% trans "Hotel Target Code" %}:</label>
                    <input type="text" class="form-control input" id="target" name="target" />
                </div>
                <div class="col-3">
                    <label class="label">{% trans "Date" %}:</label>
                    <input type="date" class="form-control text-center input" id="date" name="date" value=""/>
                </div>
                <div class="col-3 text-end text-middle">
                    <a class="btn btn-primary saveform" data-form="form-get" data-target="get-details"> {% trans "Get Bookings" %}</a>
                </div>
            </div>
        </form>
        <button class="btn btn-primary" onclick="$('#get-details').toggle()"> Ver/Ocultar resultados</button> 
        <div id="get-details"></div>
    </div>		
</div>		
<script> checkCronEnable("{{user_winhotel.hour}}", "wh-cron"); </script>
