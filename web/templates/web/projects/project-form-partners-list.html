{% load i18n padword_tags %}


{% for partner in obj.partners.all %}
    <div class="row justify-center p-0">
        <div class="col-12 p-1">
            <div class="p-sale p-3 pt-1">
                <div class="row">
                    <div class="col-10">
                        <label class="label">{% trans "Partner" %}</label>
                        <input type="text" class="form-control autosave input" id="partner" name="partner" value="{{partner.partner}}" 
                            title="{{partner.partner}}" data-model-name="web.projectpartner" data-obj-id="{{partner.id}}" 
                            data-url="{% url "autosave_field" %}" data-target="div-notification"/> <span id="partner__msg"></span>	
                    </div>
                    <div class="col-2">
                        <button class="btn btn-sm ark" id="btn-inv-remove" data-url="{%url "project-partner-remove"%}" 
                            data-target="div-partners-list" data-obj_id="{{partner.id}}" 
                            data-confirm="Confirma que desea borrar este elemento?"> <i class="fas fa-trash"></i></button>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
