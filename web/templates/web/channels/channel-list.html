{% load i18n %}
    <table class="table table-striped table-hover">
        <thead>
            <tr class="small small">
                <th> {% trans 'Nombre' %} </th>
                <th> {% trans 'Proyecto' %} </th>
                <th> {% trans 'Compañía' %} </th>
                <th> {% trans 'Activo' %} </th>
                <th colspan="2"> {% trans 'UUID' %} </th>
            </tr>
        </thead>
        <tbody>
            {% for item in items %}
            <tr class="small" id="row_{{item.id}}">
                <td>{{ item.name }}</td>
                <td>{{ item.project.name }}</td>
                <td>{{ item.project.company.name }}</td>
                <td>{% if item.active == 1 %}<i class="text-success fas fa-check-circle"></i>{% else %}<i class="text-danger fas fa-times-circle"></i>{% endif%}</td>
                <td>{{ item.uuid }}</td>
                <td class="text-nowrap">
                    <a class="btn btn-xs" href="{% url 'devices-by-channel' item.pk %}" title="{% trans 'Dispositivos' %}">
                        <i class="fas fa-tablet-alt"></i></a>
                    <a class="me-1 btn btn-xs ark" data-url="{% url "channel-form" %}" data-target-modal="common-modal" title="{% trans 'Edit' %}"
                        data-obj_id="{{item.id}}" data-project_id="{{project.id}}" data-company_id="{{company.id}}"><i class="fas fa-edit"></i></a>  
	                <a class="btn btn-sm autoremove" data-model-name="web.channel" data-obj-id="{{item.id}}" data-url="{% url "autoremove_obj" %}" 
                        data-target="row_{{item.id}}" data-project_id="{{project.id}}" data-company_id="{{company.id}}" title="{% trans 'Remove' %}"
                        data-confirm="{% trans "Are you sure to remove this element?" %}"> <i class="fas fa-trash"></i></a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
    <script>$('#items-counter').html('{{items|length}}');</script>
