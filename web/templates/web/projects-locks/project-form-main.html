{% load i18n padword_tags %}


<div class="row justify-center">
    {# -------------------- new -----------------------#}
    <div class="row m-0 p-0">
        <div class="col-3"><div id="div-image">{% include "web/projects/project-img.html" %}</div> </div>
        <div class="offset-7 col-2 divbutact">
            <div class="text-center">
                <label class="form-check-label label act-pro text-end" for="activeCheck"> {% trans "Active" %}</label>
            </div>
            <div class="form-check form-switch">
                {%if obj.active == 1%}<i class="fas fa-check"></i>{%else%}<i class="fas fa-times"></i>{%endif%}
            </div>
        </div>
    </div>
    
    <div class="row m-0 mt-3 card-info">
	    <div class="col-5">
            <label class="label">{% trans "Name" %}:</label>
            <input type="text" class="form-control input mb-4" id="name" name="name" value="{{obj.name}}" disabled/> 
        </div>
        <div class="col-5">
            <label class="label">{% trans "Company" %}:</label>
            <input type="text" class="form-control input mb-4" id="company" name="company" value="{{obj.company.name}}" disabled/> 
        </div>
        <div class="col-2">
            <label class="label">{% trans "Cerraduras totales" %}:</label>
            <input type="text" class="form-control input mb-4" value="{{obj|get_locks_number}}" disabled />
        </div>
        <div class="col-5">
           <label class="label">{% trans "Time zone" %}:</label>
           <input class="form-control input mb-4" id="time_zone" name="time_zone" value="{{obj.time_zone}}" disabled/>
        </div>
        <div class="col-5">
            <label class="label">{% trans "Time zone name" %}:</label>
            <input type="input" class="form-control input mb-4" id="time_zone_name" name="time_zone_name" 
                value="{{obj.time_zone_name}}" disabled/> 
        </div>
        <div class="col-2">
            <label class="label">{% trans "Languages" %}:</label>
            <input type="input" class="form-control input mb-4" id="used_languates" name="used_languages" 
                value="{{obj.used_languages}}" disabled/> 
        </div>
    </div>
    
    <div class="row m-0 mt-3 card-info">
        <div class="col-5">
            <label class="label">{% trans "Contact Name" %}:</label>
            <input type="text" class="form-control input mb-4" id="contact_name" name="contact_name" 
                value="{{aux.contact_name}}" disabled/> 
        </div>        
        <div class="col-5">
            <label class="label">{% trans "Email" %}:</label>
            <input type="text" class="form-control input mb-4" id="contact_email" name="contact_email" 
                value="{{aux.contact_email}}" disabled/> 
        </div>      
        <div class="col-2">
            <label class="label">{% trans "Phone" %}:</label>
            <input type="text" class="form-control input mb-4" id="contact_phone" name="contact_phone" 
                value="{{aux.contact_phone}}" disabled/> 
        </div>   
    </div>

{# -------------------- end new -----------------------#}
</div>
