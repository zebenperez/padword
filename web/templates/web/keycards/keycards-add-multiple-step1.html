{% load i18n padword_tags %}

<h2>{% trans "Añadir tarjetas" %}</h2>
<br/>

{% for card in range %}
    <div id="div-lock-{{forloop.counter}}" class="div-lock hide">
        <form method="POST" action="{% url "keycards-add-multiple-step2" %}" id="form-card-{{forloop.counter}}">
            {%csrf_token%}
            <input type="hidden" id="project" name="project" value="{{project.uuid}}" />
            <input type="hidden" id="locks" name="locks" value="{{locks}}" />
            <input type="hidden" id="ini_date" name="ini_date" value="{{ini_date}}" />
            <input type="hidden" id="end_date" name="end_date" value="{{end_date}}" />
            <input type="hidden" id="current" name="current" value="{{forloop.counter}}" />
            <input type="hidden" id="total" name="total" value="{{number}}" />
            {% trans "Tarjeta" %} {{forloop.counter}}
            <br/>
            {% trans "Nombre" %}: <input type="text" class="form-control" id="name" name="name" value="" />
            <br/>
            {% trans "Escanear tarjera" %}: <input type="text" class="form-control" id="card" name="card" value="" />
            <br/>
            <button class="btn btn-info saveform" data-form="form-card-{{forloop.counter}}" data-target="div-progress" 
                data-id="{{forloop.counter}}"> {% trans "Continuar" %}</button>
        </form>
    </div>
{% endfor %}
<div id="div-progress">{% include "web/keycards/keycards-add-multiple-progress.html" with percent=1 %}</div>
<script>
    $("#div-lock-1").show();
    $(".saveform").click(function(e){ var id = parseInt($(this).data("id")); console.log(id); $("#div-lock-"+id).hide(); $("#div-lock-"+(id+1)).show(); });
</script>
