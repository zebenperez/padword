{% load i18n padword_tags %}
<h2 class="common-modal-head">{% trans 'New keycard' %}</h2>

<span id="div-notification"></span><br/>

<div class="row justify-center">
    <div class="col-12">
        <div class="row justify-center">
            <div class="col-sm-4 col-md-4 col-12">
                <label class="label">{% trans "Bluetooth Code" %}:</label>
                <input type="text" class="form-control autosave input mb-4" id="bluetooth" name="bluetooth" value="{{obj.bluetooth}}" title="{{obj.bluetooth}}" 
                    data-model-name="web.keycard" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
                    <span id="bluetooth__msg"></span>
            </div>

            <div class="col-sm-4 col-md-4 col-12">
                <label class="label">{% trans "Card Reader Code" %}:</label>
                <input type="text" class="form-control autosave input mb-4" id="cardreader" name="cardreader" value="{{obj.cardreader}}" title="{{obj.cardreader}}" 
                    data-model-name="web.keycard" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
                    <span id="number__msg"></span>
            </div>

            <div class="col-sm-4 col-md-4 col-12">
                {% trans "Project" %}:
                <select class="form-control autosave b-bottom mb-4" id="project_uuid" name="project_uuid" value="{{obj.project_uuid}}" title="{{obj.project_uuid}}" 
                    data-model-name="web.keycard" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
                    <option value="">{% trans "-- Select a project" %}</option>
                    {% for proj in projects %}
                        <option value="{{proj.uuid}}" {%if obj.project_uuid == proj.uuid %}selected{%endif%}>{{proj.name}}</option>
                    {% endfor %}
                </select>
                <span id="project_uuid__msg"></span>
            </div>
        </div>
    </div>
</div>

<div class="d-flex justify-content-end p-2">
	<button type="button" class="btn btn-primary ark m-2" data-bs-dismiss="modal"
                          data-url="{% url "keycard-search" %}" data-project="{{obj.project_uuid}}" data-target="keycard-list-{{obj.project_uuid}}">{% trans "Save" %}</button>
	<button type="button" class="btn btn-danger ark m-2" data-bs-dismiss="modal"
    	data-url="{% url "keycard-remove" %}" data-target="keycard-list" data-obj_id="{{obj.id}}" 
	    data-confirm="{% trans "Are you sure to remove this element?" %}">{% trans "Remove" %}</button>
</div>
