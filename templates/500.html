<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Algo no ha salido como esperábamos · Padword</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #18233b;
            --muted: #66738a;
            --brand: #3765f7;
            --brand-dark: #2047c9;
            --surface: #ffffff;
            --line: #e8edf7;
        }

        * { box-sizing: border-box; }

        body {
            align-items: center;
            background: #f5f8ff;
            color: var(--ink);
            display: flex;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            justify-content: center;
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            padding: 24px;
        }

        .glow {
            background: #dfe8ff;
            border-radius: 50%;
            filter: blur(2px);
            height: 460px;
            left: -180px;
            opacity: .7;
            position: fixed;
            top: -180px;
            width: 460px;
        }

        .card {
            background: var(--surface);
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 28px;
            box-shadow: 0 24px 70px rgba(43, 71, 130, .14);
            max-width: 620px;
            padding: 52px 52px 46px;
            position: relative;
            text-align: center;
            width: 100%;
        }

        .brand {
            align-items: center;
            color: var(--ink);
            display: inline-flex;
            font-size: 18px;
            font-weight: 750;
            gap: 9px;
            letter-spacing: -.4px;
            margin-bottom: 36px;
        }

        .brand-mark {
            align-items: center;
            background: var(--brand);
            border-radius: 10px;
            color: white;
            display: inline-flex;
            font-size: 17px;
            font-weight: 800;
            height: 31px;
            justify-content: center;
            width: 31px;
        }

        .code {
            color: var(--brand);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .14em;
            margin: 0 0 14px;
        }

        h1 {
            font-size: clamp(30px, 5vw, 43px);
            letter-spacing: -1.5px;
            line-height: 1.12;
            margin: 0;
        }

        p {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.65;
            margin: 19px auto 30px;
            max-width: 430px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        a {
            border-radius: 11px;
            font-size: 15px;
            font-weight: 700;
            padding: 12px 18px;
            text-decoration: none;
            transition: background .2s ease, transform .2s ease;
        }

        .primary { background: var(--brand); color: white; }
        .primary:hover { background: var(--brand-dark); transform: translateY(-1px); }
        .secondary { border: 1px solid var(--line); color: var(--ink); }
        .secondary:hover { background: #f8faff; }

        .hint {
            color: #95a0b3;
            font-size: 13px;
            margin: 32px 0 0;
        }

        @media (max-width: 520px) {
            .card { border-radius: 22px; padding: 38px 24px 32px; }
            .brand { margin-bottom: 28px; }
            .actions a { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="glow" aria-hidden="true"></div>
    <main class="card">
        <div class="brand"><span class="brand-mark">P</span> Padword</div>
        <div class="code">ERROR 500</div>
        <h1>Algo no ha salido como esperábamos.</h1>
        <p>Hemos tenido un problema temporal. Nuestro equipo puede revisarlo; mientras tanto, vuelve al inicio o inténtalo de nuevo en unos instantes.</p>
        <div class="actions">
            <a class="primary" href="/">Volver</a>
        </div>
        <p class="hint">No se ha perdido ningún dato.</p>
    </main>
</body>
</html>
