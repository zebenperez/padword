{% load i18n bookings_tag common_tag %}

{% if category.parent %}{%include "bookings/back-btn.html" with uuid=category.parent.uuid %}{% endif %}

{% for b in form.get_public_blocks %}<div id="div-block">{%include "bookings/general/block_form.html"%}</div>{% endfor %}

<div class="col-12">
    <div class="row mt-4 mb-4 d-flex justify-content-center">
        <div class="col-lg-3 col-md-4 col-xs-2 offset-xs-1 actions text-center mb-3">
            <button class="btn btn-marine w-100 ark" data-url="{% url "booking-send" %}" 
                data-target="main" data-obj_id="{{fi.id}}"> {% trans "Send Order" %}</button>
        </div>
        <div class="col-lg-3 offset-lg-1 col-md-4 offset-md-1 col-xs-2 offset-xs-1 actions text-center mb-2">
            <button class="btn btn-marine w-100 ark" data-url="{% url "booking-remove" %}"
                data-target="main" data-obj_id="{{fi.id}}"> {% trans "Cancel Order" %}</button>
        </div>
    </div>
</div>
