{% load i18n bookings_tag common_tag %}

<div class="div-info">
    {% for f in q.field_set.all %}
		<div class="item mb-1">
			<div class="item-left"><strong>{% if q.field_set.all|length > 0 %} <br/> {{f}} <br/> {% endif %} </strong></div>
			<div class="item-right td_{{q.id}}_{{index}}"> 
                {% if not ro %}{% field_form fi q f index request.user %} {%else%} {% field_value fi q f index %} {%endif%}
            </div>
		</div>
    {% endfor %}
</div>
