{% load i18n bookings_tag common_tag %}

<div class="div-info p-3">
    {% for f in q.field_set.all %}
		<div class="item p-3 mb-1">
			<div class="item-left"><strong>{% if q.field_set.all|length > 0 %} <br/> {{f}} <br/> {% endif %} </strong></div>
			<div class="item-right td_{{q.id}}_{{index}}"> {% field_form fi q f index request.user %} </div>
		</div>
    {% endfor %}
</div>
