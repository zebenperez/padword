{% extends "base.html" %}
{% load i18n bookings_tag common_tag %}

{% block central_content %}
	<div class="row header">
		<div class="col-lg-10 col-xs-6"><h1 class="page-header"> {{fi.form.name}}</h1></div>
		<div class="col-lg-2 col-xs-6 pl-1 actions text-right">
            <a href="{% url "set-status" fi.id "02" %}" class=""> Enviar </a>
            -
            <a href="{% url "booking-remove" fi.id %}" class=""> Cancelar </a>
        </div>
	</div>
    
	<div class="row"> <div class="col-md-8" id="div-notification"></div> </div>

	<div class="row bloque">
		<div id="div-menu" class="sidebar">
			{% for item in fi.get_public_blocks %}
				<a href="javascript:void(0)" class="ark p-2 block {%if item == b%}active{%endif%}" data-url="{% url "get-block" %}" 
                    data-target="div-block" data-obj_id="{{item.id}}" data-fi_id="{{fi.id}}" data-unactive="block">{{item.text}}</a>  
			{% endfor%}
		</div>

		<div id="main" class="sh-main">
			<div class="pt-3" id="div-block">{%include "bookings/block_form.html"%}</div> 
        </div>
	</div>
{% endblock %}
