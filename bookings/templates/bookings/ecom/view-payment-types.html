{% load i18n bookings_tag common_tag padword_tags static %}


<style> .selected {border: 1px solid #28a745; border-radius: 5px;padding-bottom:5px;} </style>

<div class="row justify-content-center">
    {% for item in fi.form.get_category.payment_types.all %}
        <div class="col-6 col-lg-4 justify-content-center mt-1 pt-box" id="pt-box-{{item.id}}" tyle="border:1px solid #ccc">
            <div class="image mobile" id="cover">
                <img src="{{item.payment_type.icon.url}}" class="card-img-top" alt="{% padword_translate item.payment_type.name %}" style="width:50%">
                {% if item.payment_type.code == "01" %}
                    <input type="text" class="form-control" id="cash-value" placeholder="{%trans "Amount to pay (10, 20, 50...)"%}" 
                        style="display:none"/>
                {% endif %}
            </div>
            <br/>
            <div class="justify-content-center">
                <a class="btn btn-outline-primary btn-select-payment w-100" data-id="{{item.id}}" data-pt="{{item.payment_type.id}}" 
                    data-cash='{{item.payment_type.code}}'> {% padword_translate item.payment_type.name %}</a>
            </div>
        </div>
    {% endfor %}
</div>

<div class="row mt-5 justify-content-center">
    <div class="col-lg-5 offset-lg-1 col-md-6 col-xs-5 text-center mb-3">
        <button class="btn btn-marine w-100 ark" data-url="{% url "view-shopping-cart" %}" 
            data-target-modal="common-modal" data-project_uuid="{{fi.form.project.uuid}}" data-form_id="">{% trans "Back" %} <i class="far fa-arrow-alt-circle-left"></i></button>
    </div>
    <div class="col-lg-5 offset-lg-1 col-md-6 col-xs-5 text-center mb-3">
        <button id="btn-send-order-{{fi.id}}" class="btn btn-marine-blue w-100 ark" data-bs-dismiss="modal" data-url="{% url "booking-send" %}" 
            data-target="main" data-obj_id="{{fi.id}}" data-payment_type="" data-amount=""> {% trans "Send Order" %} <i class="fas fa-paper-plane"></i></button>
    </div>
</div>

<script>
    $(".btn-select-payment").click(function(){
        $(".pt-box").each(function(){$(this).removeClass("selected")});
        $("#pt-box-"+$(this).data("id")).addClass("selected");
        $("#btn-send-order-{{fi.id}}").data("payment_type", $(this).data("pt"));
        if ($(this).data("cash") == "01")
            $("#cash-value").show();
        else
        {
            $("#cash-value").hide();
            $("#btn-send-order-{{fi.id}}").data("amount", "");
        }
    });

    $("#cash-value").change(function(){
        $("#btn-send-order-{{fi.id}}").data("amount", $("#cash-value").val());
    });
</script>
