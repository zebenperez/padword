{% load i18n bookings_tag common_tag padword_tags static%}


<link rel="stylesheet" href="{% static 'css/menu2.css' %}" >

<div class="row d-flex justify-content-center img-carousel mt-1 ml-0">
	<div class="container"> <div class="row blog"> <div class="col-12">
        <div id="blogCarousel-{{item.id}}" class="carousel slide" data-ride="carousel">
                
            {% if item.images.count > 1 %}
                <!-- Carousel controls -->
                <button class="carousel-control-prev mt-5" type="button" data-bs-target="#blogCarousel-{{item.id}}" data-bs-slide="prev">
                    <span class="prev"><i class="fas fa-chevron-circle-left"></i></span></a> </button>
                <button class="carousel-control-next mt-5" type="button" data-bs-target="#blogCarousel-{{item.id}}" data-bs-slide="next">
                    <span class="next"><i class="fas fa-chevron-circle-right"></i></span></a> </button>
            {% endif %}

            <!-- Carousel items -->
            <div class="carousel-inner">
                {% for item in item.images.all %}
                    <div class="carousel-item {%if forloop.counter0 == 0%}active{%endif%}">
                        <div class="row slider-row">
                            <div class="col-lg-12 col-12 justify-content-center zoom">
                                {#<div class="image" id="cover"> #}
                                    {% if item.image %} 
                                        <img src="{{item.image.url}}" class="object-fit_cover-gallery" alt="{% padword_translate item.name %}"> 
                                    {% endif %}
                                {#</div>#}
                            </div>
                        </div>
                    </div>
                {% endfor %}
            </div>
        </div>
	</div> </div> </div>
</div>
