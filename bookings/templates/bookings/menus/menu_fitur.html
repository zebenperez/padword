            <span>Cerraduras</span>
        </button>
    </div> 
    <div class="tabs-1 col-6 mb-1 align-middle justify-content-center p-2">
        <button class="menu-options ark" data-url="{% url "show-sensibo-menu" %}" data-target="main" 
            data-cat_id="f0f2d2d1-6a92-b7ba-f98d-cb61fe57bca9"><img class="" src="/static/img/ico_clima.png"><br/><br/>
            <span>Clima</span> 
        </button> 
    </div>
    <div class="tabs-1 col-6 mb-1 align-middle justify-content-center p-2">

            data-cat_id="ced4b91c-8e6a-17c0-5c09-65220a86235b"><img class="" src="/static/img/ico_room_status.png"><br /><br />
        <span>Room service</span></button>
    </div> 
    <div class="tabs-1 col-6 mb-1 align-middle justify-content-center p-2">
        <button class="menu-options ark" id="btn-notifications" data-url="{% url "show-category-menu" %}" data-target="main" 
            data-cat_id="1d054de8-4198-372c-404b-4380fbe6dbc8"><img class="" src="/static/img/ico_reservas.png"><br /><br />
            <span>Reservar</span>
        </button>
    </div>
    <div class="tabs-5 col-12 mt-1 mb-1 align-middle justify-content-center p-2">
        <button class="menu-options ark" data-url="{% url "my-bookings" %}" data-target="main"
             data-project_uuid="{{form.project.uuid}}" data-cat_id="{{form.category}}"><img class="" src="/static/img/ico_pedidos.png"><br /><br />
             <span>Pedidos</span></button>
    </div>
    <span class="foot-title mb-2">Contáctanos</span>
    <div class="row menu-botton w-100 mt-2 p-2" style="background: #769d02;">
        <div class="col-lg-3 col-3" style="padding:0">
            <a href="https://wa.me/+34 607 39 29 77"><img class="" src="/static/img/whatsapp-b.png" width="30px"></a>
        </div>
        <div class="col-lg-3 col-3" style="padding:0">
            <a href="https://wa.me/+34 607 39 29 77"><img class="" src="/static/img/whatsapp.png" width="30px"></a>
        </div>
        <div class="col-lg-3 col-3" style="padding:0">
            <a href="mailto:info@padword.es"><img class="" src="/static/img/email.png" width="30px"></a>
        </div>
        <div class="col-lg-3 col-3" style="padding:0">
            <a href="https://www.padword.com/consultanos"><img class="" src="/static/img/contact.png" width="30px"></a>
        </div>
    </div>

</div>

<script id="realtime-script">
    $("#back-btn-bookings").click(function(){ $(this).hide(); $("#back-btn").show(); });
    $('#span-total-items').html('{% get_total_items request.user.username category.project_uuid %}');
    if (parseInt($("#span-total-items").html()) > 0)
        $("#count-badge").show();
    else
        $("#count-badge").hide();
    $('#realtime-script').remove();
</script>
