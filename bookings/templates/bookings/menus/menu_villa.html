{% load i18n bookings_tag common_tag padword_tags static %}


<link href="//maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" id="bootstrap-css">
<link rel="stylesheet" href="{% static 'css/menu_villa.css' %}" >

<div class="container">
	<div class="row w-100">
		<div class="col-lg-2 offset-lg-1 col-4 offset-1"><div class="logo"><img src="/static/img/logo-villa.png"></div></div>
		<div class="col-lg-5 col-1 d-none d-sm-block"></div>
		<div class="col-lg-2 offset-lg-1 col-7 pt-5">
			<div class="sugest-btn"><button type="button" class="btn btn-secondary w-100 p-2"><i class="fas fa-leaf"></i> Sostenibilidad</button></div>
		</div>
	</div>
	
    <div class="row mt-2">
        <div class="col-lg-3 offset-lg-1 col-7 w-100">
            <div class="i-love-btn"><button type="button" class="btn btn-primary w-100 p-2"> ¡Me encantó! ¡Volveré!</button></div>
		</div>
        <div class="col-lg-5 d-none d-sm-block">
            <div class="slogan"> Escucha el silencio <br /><span>Detén el tiempo en Villa María</span></div>
		</div>
        <div class="col-lg-2 col-5 w-100">
            <div class="value-btn"><button type="button" class="btn btn-primary w-100 p-2"><i class="far fa-thumbs-up"></i> Valóranos</button></div>
		</div>
	</div>
    <div class="row d-block d-sm-none">
	    <div class="col-lg-5">
            <div class="slogan"> Escucha el silencio <br /><span>Detén el tiempo en Villa María</span></div>
		</div>
	</div>

    <div class="row">
        <div class="col-lg-3 offset-lg-1 col-10 offset-1 w-100">
            <div class="covid19-btn"><button type="button" class="btn btn-outline-danger w-100 p-2"><i class="fas fa-info-circle"></i> Coronavirus</button></div>
		</div>
	</div>
	
    <div class="row">
        <div class="col-lg-3 offset-lg-5 col-8 offset-2 w-100 languages text-center pt-3" >
			<div class=""><a href="#"><img src="/static/img/de.png"></a></div>
			<div class=""><a href="#"><img src="/static/img/es.png"></a></div>
			<div class=""><a href="#"><img src="/static/img/fr.png"></a></div>
			<div class=""><a href="#"><img src="/static/img/en.png"></a></div>
		</div>
	</div>
    {% comment %} 
    <div class="row align-items-end">
		<div id="div-current-category">
		   {% for children in category.get_childrens %}
		      <div id="menu" class="col-lg-3 col-5 tabs mb-1 align-middle justify-content-center">
		            <button class="menu-options ark" data-url="{% url "show-category-menu" %}" data-target="div-current-category" 
			    data-cat_id="{{children.uuid}}">{% padword_translate children.name %}</button>
		      </div>
		   {% endfor %}
		</div>
	</div>
    {% endcomment %} 
	 
    <div class="row menu-tabs align-items-end w-100">
      <div class="col-4 mb-1 align-middle justify-content-center p2">
          <div class="tabs">
            <button class="menu-options ark" data-url="{% url "show-category-menu" %}" data-target="" data-cat_id="{{children.uuid}}">Mi Villa</button>
          </div>
	  </div> 
      <div class="col-4 mb-1 align-middle justify-content-center p2">
          <div class="tabs">
            <button class="menu-options ark" data-url="{% url "show-category-menu" %}" data-target="" data-cat_id="{{children.uuid}}">El Hotel</button>
          </div>
	  </div>
      <div class="col-4 mb-1 align-middle justify-content-center p2">
          <div class="tabs">
            <button class="menu-options ark" data-url="{% url "show-category-menu" %}" data-target="" data-cat_id="{{children.uuid}}">Gastronomía</button>
          </div>
	  </div>

	</div>

    <div class="row menu-botton pt-2">
		<div class="col-lg-2 offset-lg-2 col-3" style="padding:0;">
            <div class=""><a href="#"><i class="fas fa-wifi"></i><span> Conéctate</a></span></div>
		</div>
		<div class="col-lg-2 col-3" style="padding:0;">
			<div class=""><a href="#"><i class="far fa-comment-dots"></i><span> Recepción</a></span></div>
		</div>
		<div class="col-lg-2 col-3" style="padding:0;">
			<div class=""><a href="#"><i class="far fa-star"></i> <span>Sugerencias</a></span></div>
		</div>
    	<div class="col-lg-2 col-3" style="padding:0;">
			<div class=""><a href="#"><i class="fas fa-concierge-bell"></i><span> Más Servicios</a></span></div>
		</div>
	</div>


</div>
