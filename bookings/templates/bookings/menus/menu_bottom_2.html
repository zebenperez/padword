{% load i18n bookings_tag common_tag padword_tags static %}

<div class="row menu-botton">
    <div class="col-lg-2 offset-lg-1 col-2 offset-1" style="padding:0;">
        <button class="menu-options ark" id="btn-messages" data-url="{% url "my-messages" %}" 
            data-target="main" data-project_uuid="{{project_uuid}}"> <i class="far fa-comments"></i> <br /><span>Chat</span> 
            <span class="count badge" id="notification-badge" {%if guest.get_not_read_notifications == 0%}style="display:none"{%endif%}>
            <span id="span-notifications">{{ guest.get_not_read_notifications }}</span></span>
         </button>
    </div>
    <div class="col-lg-2 col-2" style="padding:0;">
        <button class="menu-options ark" id="btn-notifications" data-url="{% url "my-notifications" %}" 
            data-target="main" data-cat_id="{{form.category}}"> <i class="far fa-bell"></i> <br /><span>Notifications</span> 
            <span class="count badge" id="notification-badge" {%if guest.get_not_read_notifications == 0%}style="display:none"{%endif%}>
            <span id="span-notifications">{{ guest.get_not_read_notifications }}</span></span>
        </button>
    </div>
    <div class="col-lg-2 col-2" style="padding:0;">
        <button class="menu-options ark" id="btn-home" data-url="{% url "show-category-menu" %}" data-target="main"
            data-cat_id="{{form.category}}"><i class="fas fa-home"></i><br /><span>Home</span></button>
    </div>
    <div class="col-lg-2 col-2" style="padding:0;">
        <button class="menu-options ark" data-url="{% url "view-shopping-cart" %}" data-target="main"
             data-project_uuid="{{project_uuid}}" data-cat_id="{{form.category}}"><i class="fas fa-shopping-cart"></i><br />
             <span>Shopping</span>
             <span class="count badge" id="count-badge" style="display:none"><span id="span-total-items"></span></span>
        </button>
    </div>
    <div class="col-lg-2 col-2" style="padding:0;">
        <button class="menu-options ark" data-url="{% url "my-bookings" %}" data-target="main"
             data-project_uuid="{{project_uuid}}" data-cat_id="{{form.category}}"><i class="fas fa-map"></i><br /><span>Map</span></button>
    </div>
</div>
