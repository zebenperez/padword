{% load i18n padword_tags %}

{% load i18n %}

{% get_current_language as LANGUAGE_CODE %}

<p>Idioma actual: {{ LANGUAGE_CODE }}</p>

<div class="languages mt-2 d-flex gap-2">
    {% for language in totem_languages %}
    <form action="{% url 'set_language' %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ request.path }}?totem_language_selected=1">
        <input type="hidden" name="language" value="{{ language.code }}">
        <button type="submit" class="flag border-0 bg-transparent p-0" title="{{ language.name }}">
            <img src="https://flagcdn.com/w80/{{ language.flag }}.png" alt="{{ language.name }}">
        </button>
    </form>
    {% endfor %}
</div>
