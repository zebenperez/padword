{% load i18n padword_tags tz %}


<div class="table-header"> CONSUMOS </div>
<div class="table-content">
    <table class="table" id="main-table">
        <thead>
            <tr>
                <th> {% trans 'Date' %} </th>
                <th> {% trans 'Description' %} </th>
                <th> {% trans 'Amount' %} </th>
                <th> </th>
            </tr>
        </thead>
        <tbody> 
            {% for balance in band.balances.all %}
                <tr class="small guest-row" id="row_{{item.id}}"> 
                    <td> {{ balance.date|timezone:band.guest.project.time_zone_name|date:'d/m/Y H:i:s' }} </td>
                    <td> {{ balance.desc|safe }} </td>
                    <td> {{ balance.amount|floatformat:2 }} </td>
                    <td class="text-end">
                    </td>
                </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
