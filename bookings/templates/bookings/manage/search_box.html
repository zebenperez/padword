{% load i18n padword_tags %}


{% with related="s-page,s-project,s-form,s-ini_date,s-end_date,s-name,s-status" %}

    <input type="hidden" name="s-page" id="s-page" value="{{page}}" data-target="table-list-bookings" data-related="{{related}}" data-append="append" 
        data-url="{% url 'bookings-page' %}" class="autosearch_change"/>

    <input type="hidden" name="s-status" id="s-status" value="{{status}}" data-target="booking-list" data-related="{{related}}" 
        data-url="{% url 'bookings-search' %}" class="autosearch_change"/>

    <div class="toolbar-search">
        <div class="row">
            <div class="col-md-3 col-6">
                <input type="text" class="autosearch form-control form-control-dark w-30" name="s-project" id="s-project" 
                    placeholder="{% trans "Project name" %}" value="{{project_name}}" data-url="{% url "bookings-search" %}" 
                    data-target="booking-list" data-related="{{related}}" />
            </div>
            <div class="col-md-3 col-6">
                <input type="text" class="autosearch form-control form-control-dark w-30" name="s-form" id="s-form" 
                    placeholder="{% trans "Service name" %}" value="{% padword_translate form_name %}" data-url="{% url "bookings-search" %}" 
                    data-target="booking-list" data-related="{{related}}"/>
            </div>
            <div class="col-md-2 col-xs-12">
                <input type="text" class="autosearch form-control form-control-dark w-30" name="s-name" id="s-name" 
                    placeholder="{% trans "Guest Name, Surname, Email, Phone, Room" %}" data-url="{% url "bookings-search" %}" 
                    data-target="booking-list" data-related="{{related}}" />
            </div>
            <div class="col-md-2 col-6">
                <input type="date" class="autosearch_change form-control form-control-dark w-30" name="s-ini_date" id="s-ini_date" 
                    placeholder="{% trans "Initial date" %}" value="{{ini_date|date:'Y-m-d'}}" data-url="{% url "bookings-search" %}" 
                    data-target="booking-list" data-related="{{related}}" />
            </div>
            <div class="col-md-2 col-6">
                <input type="date" class="autosearch_change form-control form-control-dark w-30" name="s-end_date" id="s-end_date" 
                    placeholder="{% trans "End date" %}" value="{{end_date|date:'Y-m-d'}}" data-url="{% url "bookings-search" %}" 
                    data-target="booking-list" data-related="{{related}}" />
            </div>
        </div>
        {% comment %}
        <div class="row mt-1">
            <div class="col-12 d-flex justify-content-center">
                <a id="btn-status-" class="btn btn-status btn-{% if status == '' or not status %}primary{%else%}light{%endif%} pointer me-1" 
                    data-value=""> <small>{% trans 'All' %}</small></a>
                {% for item in status_list %}
                    <a id="btn-status-{{item.pk}}" data-value="{{item.id}}"
                        class="btn text-nowrap btn-status btn-{% if status == item.pk %}primary{%else%}light{%endif%} pointer me-1">
                        <small>{% padword_translate item.name %}</small></a>
                {% endfor %}
            </div>
        </div>
        {% endcomment %}
    </div>
    <script>
        $(".btn-status").click(function(){
            $('#s-status').val($(this).data("value"));
            $('#s-status').trigger('change');
            $('.btn-status').removeClass('btn-primay').addClass('btn-light');
            $(this).addClass('btn-primay');
        });
    </script>

{% endwith %}
