{% load i18n padword_tags %}

<script src="https://code.jquery.com/ui/1.13.2/jquery-ui.js"></script>


{% if msg %} <div class="d-flex row"> <div class="col"><div class="alert alert-info"><strong>{{msg}}.</strong></div></div> </div> {% endif %}

<div class="d-flex">
    <table class="table table-striped table-hover">
        <thead>
            <tr class="small small">
                <th class="row status-head">
                    {% for status in status_list %}
                    <div class="col text-center ms-1 me-1">
                        <small>{% padword_translate status.name %} (<span id="counter-{{status.pk}}">0</span>)</small><br>
                    </div>
                    {% endfor %}
                </th>
            </tr>
            <tr class="small small">
                <th class="row div-cards text-center">
                    {% for status in status_list %}
                    <div class="col text-center ui-droppable ui-widget-header col-status" id="status-{{status.pk}}" data-pk="{{status.pk}}">
                    </div>
                    {% endfor %}
                </th>
            </tr>
        </thead>
        <tfoot>
            {%comment%}
            <tr>
                <td><a class="small d-flex justify-content-center btn" id="btn-see-more" onclick="$('#s-page').val($('#btn-see-more').data('page'));$('#s-page').trigger('change');">...</a></td>
            </tr>
            {%endcomment%}
        </tfoot>
        <tbody id="table-list-bookings">
            {% include "bookings/manage/booking-page-drag.html" %}
        </tbody>
    </table>
</div>
<script>
    checkNotify($("#s-ini_date").val(), $("#s-end_date").val());
    $('#btn-see-more').data('page',{{page|add:1}});
    $('#total-items').html('{{total_items}}');
{% comment %}
    var observer = new IntersectionObserver(function(entries) {
        if ((entries[0].isIntersecting === true) && ({{total_items}} > {% items_per_page %}))
        {
            $('#btn-see-more').trigger("click");
        }
    }, { threshold: [1] });
    observer.observe(document.querySelector("#btn-see-more"));
{% endcomment %}
    
    $('.btn-status').removeClass('btn-primary').addClass('btn-light');
    $('#btn-status-{{status}}').removeClass('btn-light').addClass('btn-primary');
    bookings_by_state();
</script>

    <script>
        $( function() {
            $( ".ui-draggable" ).draggable( {
                start:function(event, ui) {
                    $(this).addClass('indragmode');
                    $(this).attr('oldParent',$(this).parent().attr("id"));
                },
                stop:function(event, ui) {
                    $(this).removeClass('indragmode');
                },
                containment: ".div-cards",
            });

            $( ".ui-droppable" ).droppable({
                drop: function( event, ui ) {
                    $(ui.draggable).prependTo('#'+$(this).attr("id"));
                    var datas = {};
                    datas["status"] = $(this).attr("data-pk");
                    datas["fi_id"] = $(ui.draggable).attr("data-pk");
                    datas["comment"] = '';
                    url = "{% url 'change-status' %}";
                    ajaxGetMute(url, datas, "", "");
                    $(ui.draggable).removeAttr('style');
                    bookings_by_state();
                }
            });
        } );
    </script>
