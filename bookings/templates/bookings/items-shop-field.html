{% load i18n static padword_tags bookings_tag common_tag %}

{% for item in item_list %}
    <div class="col-lg-3 col-md-4 col-xs-5 m-1 d-flex justify-content-center">
        <div class="card w-100">
            <div class="image" id="cover">
                <img src="{% if item.image %}{{item.image.url}} {%else%} {% static 'img/none.png' %}{%endif%}" class="object-fit_cover" 
                    alt="{% padword_translate item.name %}">
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-10"> <h5 class="card-title text-dark">{% padword_translate item.name %}</h5> </div>
                    <div class="col-2"> <h4 class="card-title text-dark text-right">{{ item.price}} &euro; </h4> </div>
                    <div class="col-12"> <p class="card-text text-secondary">{% padword_translate item.description %}</p> </div>
                </div>
            </div>
            <div class="card-footer">
                <div class="text-center">
                    {% if item.uuid != value %}
                        <a class="btn btn-xs btn-info ark" data-url="{% url "select-item" %}" data-target="div-items-shop-{{answer_name}}" 
                            data-fi="{{fi_id}}" data-question="{{q_id}}" data-field="{{f.id}}" data-index="{{index}}" data-value="{{item.uuid}}"> 
                            {% trans "Select" %}</a>
                    {% else %}
                        <a class="btn btn-xs btn-success ark" data-url="{% url "select-item" %}" data-target="div-items-shop-{{answer_name}}" 
                            data-fi="{{fi_id}}" data-question="{{q_id}}" data-field="{{f.id}}" data-index="{{index}}" data-value=""> 
                            {% trans "Unselect" %}</a>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
{% endfor %}
