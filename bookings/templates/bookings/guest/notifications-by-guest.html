{% load i18n padword_tags %}

{% include "bookings/back-btn.html" with uuid=cat_uuid %}

<div class="col-10 card info-panel p-2" style="width: 96%; margin-left:2%;">
    <div class="content">
        <div class="toolbar-content"> <h1 class="ql-align-center">{% trans 'My notifications' %}</h1></div>
        <div id="notification-list" class="mb-4"> {% include "bookings/guest/notification-list.html" %} </div>
    </div>
</div>
<a class="ark" id="btn-check" data-url="{%url "notifications-check"%}" data-target="notification-list" data-obj_id="{{guest.id}}" 
    style="display:none"></a>
<script>
    function checkNotificationList() { $("#btn-check").click(); setTimeout(checkNotificationList, 60000); }
    checkNotificationList();
</script>
