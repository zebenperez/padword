{% load i18n padword_tags %}

<div class="">
    <div class="row booking-head p-2">
        <div class="col-10 pl-1">{% trans 'Message' %}</div>
        <div class="col-2"></div>
    </div>
    {% for item in guest.get_public_notifications %}
        <div class="row booking-line pointer pt-3 pb-3 ark {%if item.read%}color-grey{%else%}font-bold{%endif%}" id="row_{{item.id}}" 
            data-url="{% url "notification-view" %}" data-target-modal="common-modal" data-obj_id="{{item.id}}">
            <div class="col-10 pl-20"><strong>{% padword_translate item.notification.subject %}</strong></div>
            <div class="col-2 text-right chevron pr-20"><i class="fas fa-chevron-right fa-lg"></i> </div>
        </div>
    {% endfor %}
</div>
