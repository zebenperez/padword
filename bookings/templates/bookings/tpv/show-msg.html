{% load i18n padword_tags static %}

<div class="row">
	<div class="col-8 offset-2 info-panel-msg">
		<div class="row">	
			<div class="col-12 text-center mt-3 mb-3 pt-3">
				{% if msg == "01" %}
					<i class="fas fa-check-circle text-success"></i><br/><h4 class="success mt-3">
                        {% trans "Your order has been sent correctly!" %}</h4>
				{% elif msg == "05" %}
					<i class="fas fa-ban text-cancel"></i><br /><h4 class="cancel mt-3" style="color:#333;">
                        {% trans "Your order has been cancelled correctly!" %}</h4>
				{% endif %}
			</div>	
		</div>
		<div class="row">	
			<div class="col-12 text-center mt-3 mb-3 pt-3">
                <button class="me-1 btn btn-access ark" data-url="{% url "tpv-index" project_uuid %}" data-target="base">{%trans "Back"%}</button>
	        </div>
	    </div>
	</div>
</div>
