{% load i18n padword_tags %}

<div id="base-tpv" class="fixed-layout w-100">
    <div class="row left-tpv w-100 text-center m-0">
        <div class="col-lg-3 col-3 name">
            <button class="btn ark w-100" data-url="{%url "tpv-change-pos"%}" data-target="base" data-project_uuid="{{project_uuid}}">
                {{pos.name}}</button>
        </div>
        <div class="col-lg-3 offset-lg-2 col-7 text-center">
            <select name="" id="" class="tpv-articles w-100 text-center tpv-search-change" data-search-class="tpv-category">
                <option value="">Todos los artículos</option>
                {% for item in cat_list %}
                    <option value="{{item.pk}}">{% padword_translate item.name %}</option>
                {% endfor %}
            </select>
        </div>
        <div class="col-lg-1 offset-lg-3 col-2 text-center">
            <button class="btn btn-header-pwa ark" data-url="{%url "tpv-close"%}" data-target="base" 
                data-project_uuid="{{project_uuid}}"> <i class="fas fa-power-off"></i></button>
        </div>
    </div>
    <div class="right-tpv">
        <div class="row header-right w-100 m-0 mb-2">
            <div class="col-lg-3 text-start">Ticket</div>
            <div class="col-lg-6 col-2">
                <button class="btn ark table-selector" data-url="{%url "tpv-change-table"%}" data-target="base" 
                    data-project_uuid="{{project_uuid}}"> {{table.name}}</button>
            </div>
            <div class="col-lg-2 offset-lg-1 logo"><img src="/static/img/96x96-icono.png"></div>
        </div>
        <div class="row w-100 m-0">
           <div class="col-lg-12">
                <div class="row w-100 m-0">
                    <div class="{% if pos.scan_room %}col-6{%else%}col-12{%endif%}">
                        <div class="d-none d-lg-block" id="block-scan">
                            <input type="text" id="div-scan" class="form-control ark_change" name="bans-scan"
                                data-url="{% url "tpv-check-band" %}" data-target="ticket-summary" data-obj_id="{{fi.id}}" 
                                placeholder="Scan band..."/>
                        </div>
                    </div>
                    {% if pos.scan_room %}
                        <div class="col-6">
                            <div class="d-none d-lg-block" id="block-scan-room">
                                <input type="text" id="div-scan-room" class="form-control ark_change" name="bans-scan-room"
                                    data-url="{% url "tpv-check-room" %}" data-target="ticket-summary" data-obj_id="{{fi.id}}" 
                                    placeholder="Habitación..."/>
                            </div>
                        </div>
                    {% endif %}
                </div>
         
                <div id="ticket-summary">{% include "bookings/tpv/view-ticket.html" %}</div>
            </div>
        </div>
    </div>

    <div id="main" class="main-tpv">
        {% if form and form != None %}
            {% include "bookings/tpv/tpv-cart.html" %}
        {% endif %}
    </div>
</div>
{% include "common-modal.html" %}
