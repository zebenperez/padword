{% load i18n %}

<div class="table-box p-2 text-left">
    <small>
    {% if fi and fi.get_total > 0%}
        <span class="order-on">
            {%trans "Order"%}: {{fi.pos.name}} <br /> {{fi.details.client}} <br /> {{fi.get_total}} €
        </span>
    {% else %}
        <span class="order-off">
            {%trans "No order"%}
        </span>
    {% endif %}
    </small>
</div>
