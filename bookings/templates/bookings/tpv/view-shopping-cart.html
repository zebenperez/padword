{% load i18n %}

{% for fi in fi_list %}
    {% with items=fi.get_items total=fi.get_total %}
        {% if items|length > 0 %}
            {% include "bookings/tpv/view-shopping-cart-fi.html" %}
        {% endif  %}
    {% endwith %}
{% endfor %}

<div class="row justify-content-center">
    <div class="col-lg-5 offset-lg-1 col-md-6 col-xs-5">
        <button type="button" class="btn btn-marine w-100 ark" data-bs-dismiss="modal">
            {% trans "Continue shopping" %} <i class="fas fa-cart-plus"></i></button>
    </div>
</div>
