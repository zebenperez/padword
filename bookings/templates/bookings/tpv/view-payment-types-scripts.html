{%load i18n tpv_tags %}

<script>
    $(".btn-select-payment").click(function(){
        $(".pt-box").each(function(){$(this).removeClass("selected")});
        $("#pt-box-"+$(this).data("id")).addClass("selected");

        $("#btn-send-order-{{fi.id}}").removeClass("a-disabled");
        $("#btn-send-order-{{fi.id}}").data("payment_type", $(this).data("pt"));

        $("#btn-return-order-{{fi.id}}").removeClass("a-disabled");
        var ptReturn = $("#btn-return-order-{{fi.id}}").data("payment_type")+""+$(this).data("pt");
        $("#btn-return-order-{{fi.id}}").data("payment_type", ptReturn);

        $("#btn-discount-confirm-{{fi.id}}").removeClass("a-disabled");

        //var ptFree = $("#btn-free-order-{{fi.id}}").data("payment_type")+""+$(this).data("pt");
        //$("#btn-free-order-{{fi.id}}").data("payment_type", ptFree);

        {%comment%}
        if ($(this).data("cash") == "01") { $("#cash-value").show(); }
        else { $("#cash-value").hide(); }
        {%endcomment%}
    });

    {%comment%}
    $("#cash-value").change(function(){
        $("#btn-send-order-{{fi.id}}").data("amount", $("#cash-value").val());
    });
    {%endcomment%}

    {% with val=fi|check_band %}
        {# Band locked #}
        {% if val == 1 %} $("#band-alert").html("{% trans "ADVISE: This band is locked!" %}"); {% endif %} 

        {# Item not valid #}
        {% if val == 3 %} $("#band-alert").html("{% trans "ADVISE: You have invalid products, please remove!" %}"); {% endif %} 

        {# Not enough credit #}
    {% if val == 4 %} $("#band-alert").html("{% trans "<strong>ADVISE:</strong><br />You have not balance, recharge your band!" %}"); $('band-alert-container').show(); {% endif %} 

        {# Lock send btn #}
        {% if val == 1 or val == 3 or val == 4 %} $("#btn-send-order-{{fi.id}}").addClass("a-disabled"); {% endif %} 
    {% endwith %}

    {%comment%}
    {% with val=fi|check_band %}
        {# Not band #}
        {% if val == 0 %} $("#pay-type-03").addClass("a-disabled"); {% endif %} 

        {# Band locked #}
        {% if val == 1 %}
            $("#pay-type-03").addClass("a-disabled");
            $("#band-alert").html("{% trans "ADVISE: This band is locked!" %}");
        {% endif %} 

        {# No limit #}
        {% if val == 2 %}{% endif %} 

        {# Item not valid #}
        {% if val == 3 %}
            $("#pay-type-03").addClass("a-disabled");
            $("#band-alert").html("{% trans "ADVISE: You have invalid products, please remove!" %}");
        {% endif %} 

        {# Not enough credit #}
        {% if val == 4 %}
            $("#pay-type-03").addClass("a-disabled");
            $("#band-alert").html("{% trans "ADVISE: You have not balance, recharge your band!" %}").show();
            $("#btn-return-{{fi.id}}").removeClass("a-disabled");
        {% endif %} 

        {# Credit 0 #}
        {% if val == 5 %}{% endif %} 

        {# Have credit #}
        {% if val == 6 %} $("#btn-return-{{fi.id}}").removeClass("a-disabled"); {% endif %} 
    {% endwith %}
    {%endcomment%}
</script>
