{% load i18n tpv_tags %}

{% if cash.close %}
    <div class="row" style="margin-top:100px"> <div class="col-12 text-end">{{pos.name}}</div> </div>
    <div class="row" style="margin-top:100px"><div class="col-12 text-center">
        {% trans "TPV Close!" %}
        <button class="btn ark w-100" data-url="{% url "tpv-change-pos" %}" data-target="base" data-project_uuid="{{pos.project_uuid}}">
            {% trans "Back" %}</button>
    </div></div>
{% elif created or cash.ini_cash < 0 %}


    <div class="row m-0">
            <div class="col-lg-6 offset-lg-3 col-12 mt-3 pos-options p-0"
                {%if pos.image%}style="background-image:url({{pos.image.url}});"{%endif%}>
            <div class="point-name" style="width: 100%;background: white; opacity: 0.8;">{{pos.name}}</div>
        </div>
    </div>
    <div class="row m-0 mt-3">
        <div class="col-12 text-center pb-3">{% trans "Fondo de caja" %}</div>
    </div>
    <div class="row m-0 mt-3">
        <div class="col-lg-4 offset-lg-4 col-12"><input type="text" class="form-control" onchange="$('#btn-cash').data('value', $(this).val())" placeholder="Introduce la cantidad" /></div>
    </div>
    <div class="row m-0 mt-3">
        <div class="col-lg-4 offset-lg-4 col-12">
            <button id="btn-cash" class="menu-options tables save ark" data-url="{%url "tpv-set-cash"%}" data-target="base" 
                data-obj_id="{{cash.id}}" data-value="" data-index="{{index}}"><i class="fa fa-save"></i> {% trans "Save" %} </button>
        </div>
    </div>
{% else %}
    <div class="row m-0 p-0 w-100">
        <div class="col-lg-10 col-9">
            <input class="form-control tpv-table-search" data-search-class="table-card" placeholder="{%trans "Seleccionar mesa a buscar..."%}"/>
        </div>
        <div class="col-lg-1 col-1 pt-3 text-center" onclick="$('#cash-opts').fadeToggle()"> 
            <a href="#" class="menu-btn"><i class="fas fa-bars menu"></i></a> 
        </div>
        <div class="col-lg-1 col-2 p-2 text-center"> 
            <button class="btn btn-primary mobile ark w-100" data-url="{% url "tpv-change-pos" %}" data-target="base" 
                data-project_uuid="{{pos.project_uuid}}"> <i class="far fa-arrow-alt-circle-left"></i></button>
        </div>
    </div>
    <div id="cash-opts" class="hide mt-2">
        <button class="btn btn-outline-secondary btn-sm pointer add-date ark" id="btn-pos-summary" data-url="{%url "tpv-cash-z"%}" data-target="base" 
            data-obj_id="{{cash.id}}" data-index="tpv-index"><i class="fas fa-file-csv"></i>&nbsp; {% trans "Generate Z" %}</button>
        <button class="btn btn-outline-secondary btn-sm pointer add-date ark" id="btn-pos-summary" data-url="{%url "tpv-cash-x"%}" data-target="base"
            data-obj_id="{{cash.id}}" data-index="tpv-index"><i class="fas fa-file-csv"></i>&nbsp; {% trans "Generate X" %}</button>
    </div>
    {% for item in tables %}
        <div class="col-lg-3 col-12 table-card mt-2" data-name="{{item.name}}">
            <button class="menu-options tables ark" 
                data-url="{%url "tpv-set-table"%}" data-target="base" data-obj_id="{{item.id}}" data-index="{{index}}">
                <div class="row w-100 m-0">
                    <div class="col-9 text-left">{{item.name}}</div>
                    <div class="col-3 text-right"><i class='fas fa-concierge-bell'></i></div>
                </div>
                {% get_table_info pos item %}
            </button>
        </div>
    {% endfor %}
{% endif %}
