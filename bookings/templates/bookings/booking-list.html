{% load i18n %}

<table class="table table-striped table-hover">
    <thead>
        <tr class="small small">
            <th> {% trans 'Device' %} </th>
            <th> {% trans 'Name' %} </th>
            <th> {% trans 'Date' %} </th>
            <th> {% trans 'Status' %} </th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
            <tr class="small" id="row_{{item.id}}">
                <td></td>
                <td></td>
                <td>{{ item.date }}</td>
                <td>{{ item.get_status_display }}</td>
                <td class="d-flex justify-content-end">
                    <a class="me-1 btn btn-xs ark" title="{%trans "Change status"%}" data-url="{%url "status-form" %}" 
                        data-target-modal="common-modal" data-obj_id="{{item.id}}">Cambio de estado</a> 
                    <a class="me-1 btn btn-xs ark" title="{%trans "Log"%}" data-url="{%url "booking-log" item.id%}" data-target-modal="common-modal" 
                        data-obj_id="{{item.id}}"><i class="fas fa-eye"></i></a>                     
                    <a class="me-1 btn btn-xs" href="{% url "booking-edit" item.id %}" target="_blank"><i class="fas fa-edit"></i></a>  
                    <a class="btn btn-sm autoremove" data-model-name="bookings.forminstance" data-obj-id="{{item.id}}" 
                        data-url="{% url "autoremove_obj" %}" data-target="row_{{item.id}}" 
                        data-confirm="{% trans "Are you sure to remove this element?" %}"><i class="fas fa-trash"></i></a>
                </td>
            </tr>
        {% endfor %}
    </tbody>
</table>
{% include "common-modal.html" %}
