{% load i18n padword_tags %}

{% if pos %}
    <div class="row m-0">
        <div class="col-6"> <strong>{% trans "Current point of sale" %}: {{pos.name}}</strong> </div>
        <div class="col-3"> <input type="date" class="form-control" id="date" name="date" value="date"/> </div>
        <div class="col-3">
            <button class="btn btn-sm pointer add-date ark" id="btn-pos-summary" data-url="{% url "orders-daily-summary" %}"
                data-target="file-list" data-obj_id="{{pos.id}}" data-date="">
                <i class="fas fa-file-csv"></i>{% trans "Generate file" %}</button>
            <button class="btn btn-sm pointeri add-date ark" id="btn-pos-z" data-url="{% url "orders-z" %}"
                data-target="file-list" data-obj_id="{{pos.id}}" data-date="">
                <i class="fas fa-file-csv"></i>{% trans "Generate Z" %}</button>
        </div>
    </div>
    <script> $("#date").change(function(){ $(".add-date").data("date", $(this).val()); }); </script>
{% endif %}

<div class="toolbar-content"> <h2 class="b-right">{% trans 'Z' %} </h2> </div>
<div class="d-flex p-2">
    {% for key, value in dic.items %}
        {{key}}: {{value}}
    {% endfor %}
</div>
