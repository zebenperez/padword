{% load static padword_tags i18n %}
{#<html>#}
    {% comment %}
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="">
        <title>Padword by Shidix</title>
        <link rel="manifest" href="{% static 'manifest.json' %}">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

        <!-- Font awesome -->
        <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">

        <!-- JQuery -->
        <script src="https://code.jquery.com/jquery-3.5.1.js" ></script>

        <!-- Shidix -->
        <link rel="stylesheet" href="{% static 'pwa/css/styles_guest.css' %}" >
        <script src="{% static "js/common.js" %}"></script>
        <script src="{% static "bookings/js/bookings_forms.js" %}"></script>

        <!-- Favicons -->
        <meta name="theme-color" content="#7952b3">

    </head>
    {% endcomment %}
    {#<body style="background:url('/static/img/bg-test.jpg'); background-size: cover;">#}
	    <div class="row div-top w-100 p-0 m-0">
		    <div class="col-lg-9 col-3 text-left"><img src="/static/img/logo-villa-maria.png"></div>
		    <div class="col-lg-2 col-6">
                <button class="btn btn-info-pwa ark" data-url="{% url "my-bookings" %}" data-target="main" data-project_uuid="{{project_uuid}}" data-cat_id="{{form.category}}">
                    <i class="fas fa-suitcase"></i> <br />{% trans "My bookings" %}</button>
		    </div>
		    <div class="col-lg-1 col-3">
                <button class="btn btn-info-pwa ark" data-url="{% url 'close-spa' %}" data-target-modal="common-modal" data-bs-dismiss="modal"
                    onclick="closeWin('#div-close')"><i class="fas fa-sign-in-alt"></i> <br /> {% trans 'Close' %}</button>
            </div>
	    </div>

        <div class="div-transparent- pl-4 pr-4 pt-2">
            <div class="container-fluid" id="main-pwa">
                <div class="row mt-1">
                    {% include "bookings/show-category-content.html" %}
                </div>
            </div>
        </div>
        {% include "common-modal.html" %}

        <script>
            document.addEventListener('DOMContentLoaded', function() 
                {
                    navigator.serviceWorker.register('/static/js/sw.js');
                    Notification.requestPermission(function(result) {
                        if (result === 'granted') {
                            navigator.serviceWorker.ready.then(function(registration) {
                                //registration.showNotification('Notification with ServiceWorker');
                            });
                        }
                    });
                }); 
        </script>
    {#</body>#}
{#</html>#}
