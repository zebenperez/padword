{% load i18n bookings_tag common_tag padword_tags static%}
{% get_css_project form.project.pk %}
        
<div class="row div-top w-100 p-0 m-0">
    <div class="col-lg-1 col-1 text-center p-0 pt-2">
        <button id="back-btn" class="btn btn-header-pwa text-center ark pl-2 pr-2" data-url="{% url "show-category-menu" %}" data-target="main" 
            data-cat_id="" data-cat_home="{{form.category}}" style="display:none"><i class="fas fa-chevron-left"></i> </button>
        <button id="back-btn-bookings" class="btn btn-header-pwa text-center ark" data-url="{% url "my-bookings" %}" data-target="main" 
            data-project_uuid="{{project_uuid}}" data-cat_id="{{form.category}}" style="display:none"> <i class="fas fa-chevron-left"></i> </button>
    </div>
            
    <div class="col-lg-7 col-3" style="padding-left:0px !important;">{%if form.logo%}<img src="{{form.logo.url}}">{%endif%}</div>
            
    <div class="col-lg-4 col-8">
        <div class="row" id="div-top-lang-menu">
            <div class="col-3 text-center p-0">
                <button class="btn btn-header-pwa text-center ark" id="btn-home" data-url="{% url 'show-category-menu' %}" data-target="main" 
                    data-cat_id="{{form.category}}"> <i class="fas fa-home"></i> <br /> <span>{% trans 'Home' %}</span></button>
            </div>
                
            <div class="col-3 text-center p-0">
                <button class="btn btn-header-pwa text-center ark" id="btn-bookings" data-url="{% url "my-bookings" %}" data-target="main" 
                    data-project_uuid="{{project_uuid}}" data-cat_id="{{form.category}}"> <i class="far fa-calendar"></i> <br />
                    <span>{% trans 'Bookings' %}</span></button>
            </div>
               
            <div class="col-3 text-center p-0">
                <button id="shopping-cart-btn" class="btn btn-header-pwa ark" data-url="{% url 'view-shopping-cart'  %}" 
                    data-target-modal="common-modal" data-form_id=""> <i class="fas fa-shopping-cart"></i><br />
                    <span class="subtext">{% trans 'Shopping' %}</span>
                    <span class="count badge" id="count-badge" style="display:none"><span id="span-total-items"></span></span>
                </button>
            </div>

            <div class="col-3 text-center p-0">
                <button class="btn btn-header-pwa ark" data-url="{% url "close-spa" %}" data-target="div-main" 
                    data-category_uuid="{{form.category}}"> <i class="fas fa-sign-in-alt"></i> <br/> <span>{% trans 'Close' %}</span></button>
            </div>
        </div>
    </div>
</div>

<div class="div-transparent- pl-4 pr-4 pt-2">
    <div id="main-pwa"> <div class="mt-1"> {% include "bookings/show-category-content.html" %} </div> </div>
</div>

<button id="btn-promo" class="ark" data-url="{% url 'pwa-get-promos' %}" data-target-modal="common-modal" 
    data-project_uuid="{{project_uuid}}" style="display:none"> </button>

{% include "common-modal.html" %}

<script>
    $("#btn-promo").click();
    $("#btn-home").click(function(){ $("#back-btn").hide(); $("#back-btn-bookings").hide();});
    $("#btn-bookings").click(function(){ $("#back-btn").hide(); $("#back-btn-bookings").hide();});
    $("#back-btn").click(function(){ if ($(this).data("cat_id") == $(this).data("cat_home")) $(this).hide(); else $(this).show(); });
    $("#back-btn-bookings").click(function(){ $(this).hide(); $("#back-btn").show(); });

    document.addEventListener('DOMContentLoaded', function() 
    {
        navigator.serviceWorker.register('/static/js/sw.js');
        Notification.requestPermission(function(result) {
            if (result === 'granted') {
                navigator.serviceWorker.ready.then(function(registration) {
                    //registration.showNotification('Notification with ServiceWorker');
                });
            }
        });
    }); 
</script>
<script id="realtime-script">
    $('#btn-home').click();
    $('#realtime-script').remove();
</script>
{% if request.user.is_authenticated %}<script> checkGuestNotify("{{form.pk}}"); </script>{% endif %}
