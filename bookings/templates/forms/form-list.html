{% load i18n padword_tags %}

<table class="table table-striped table-hover">
    <thead>
        <tr class="small small">
            <th >
                <div class="row">
                    <div class="col-3">{% trans 'Name' %}</div>
                    <div class="col-3">{% trans 'Project' %}</div>
                    <div class="col-6">{% trans 'Category' %}</div>
                </div>
            </th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr id="row-{{item.id}}" class="row-form row-active-{{item.active}}">
            {% include "forms/form-row.html" with item=item %}
        </tr>
        {% endfor %}
    </tbody>
</table>
