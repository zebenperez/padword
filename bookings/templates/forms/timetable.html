{% load i18n padword_tags %}

<div class="row"><div class="col-12 text-right">
    <a class="ark" data-url="{% url 'form-new-timetable' %}" data-target="div-timetable-{{obj.id}}" data-obj_id="{{obj.id}}"> 
        {% trans "Add timetable" %}</a>
</div></div>

<div class="row">
    <div class="col-12">{% trans "Description" %}</div>
    <div class="col-12">
        <textarea class="form-control autosave b-bottom mb-4" id="t-desc" name="desc_out_of_order" data-model-name="bookings.form" 
            data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" style="display:none" data-target="div-notification"></textarea> 
            <span id="t-desc__msg"></span>
            <div id="t-desc-editor" style="height:200px; overflow:scroll;">{% padword_translate obj.desc_out_of_order %}</div>
    </div>

    {% for item in obj.timetables.all %}
        <div class="12 text-center p-10"><h4>{% trans "Timetable" %} {{forloop.counter}}</h4></div>
        <div class="col-5">                            
            <input class="form-check-input autosave" type="checkbox" id="monday" name="monday" data-model-name="bookings.formtimetable" 
                data-obj-id="{{item.id}}" data-bool="True" data-url="{%url "autosave_field"%}" data-target="div-notification"
                {%if item.monday%}checked{%endif%}> <label class="form-check-label" for="monday">{% trans "Monday" %}</label><br/>
 
            <input class="form-check-input autosave" type="checkbox" id="tuesday" name="tuesday" data-model-name="bookings.formtimetable" 
                data-obj-id="{{item.id}}" data-bool="True" data-url="{%url "autosave_field"%}" data-target="div-notification"
                {%if item.tuesday%}checked{%endif%}> <label class="form-check-label" for="tuesday">{% trans "Tuesday" %}</label><br/>

            <input class="form-check-input autosave" type="checkbox" id="wednesday" name="wednesday" data-model-name="bookings.formtimetable" 
                data-obj-id="{{item.id}}" data-bool="True" data-url="{%url "autosave_field"%}" data-target="div-notification"
                {%if item.wednesday%}checked{%endif%}> <label class="form-check-label" for="wednesday">{% trans "Wednesday" %}</label><br/>

            <input class="form-check-input autosave" type="checkbox" id="thursday" name="thursday" data-model-name="bookings.formtimetable" 
                data-obj-id="{{item.id}}" data-bool="True" data-url="{%url "autosave_field"%}" data-target="div-notification"
                {%if item.thursday%}checked{%endif%}> <label class="form-check-label" for="thursday">{% trans "Thursday" %}</label><br/>

            <input class="form-check-input autosave" type="checkbox" id="friday" name="friday" data-model-name="bookings.formtimetable" 
                data-obj-id="{{item.id}}" data-bool="True" data-url="{%url "autosave_field"%}" data-target="div-notification"
                {%if item.friday%}checked{%endif%}> <label class="form-check-label" for="friday">{% trans "Friday" %}</label><br/>

            <input class="form-check-input autosave" type="checkbox" id="saturday" name="saturday" data-model-name="bookings.formtimetable" 
                data-obj-id="{{item.id}}" data-bool="True" data-url="{%url "autosave_field"%}" data-target="div-notification"
                {%if item.saturday%}checked{%endif%}> <label class="form-check-label" for="saturday">{% trans "Saturday" %}</label><br/>

            <input class="form-check-input autosave" type="checkbox" id="sunday" name="sunday" data-model-name="bookings.formtimetable" 
                data-obj-id="{{item.id}}" data-bool="True" data-url="{%url "autosave_field"%}" data-target="div-notification"
                {%if item.sunday%}checked{%endif%}> <label class="form-check-label" for="sunday">{% trans "Sunday" %}</label>
        </div>
        <div class="col-4">                            
            <input type="time" class="form-control autosave b-bottom mb-4" id="ini_time" name="ini_time" data-model-name="bookings.formtimetable" 
                value="{{item.ini_time}}" data-obj-id="{{item.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/> 
                <span id="ini_time__msg"></span>

            <input type="time" class="form-control autosave b-bottom mb-4" id="end_time" name="end_time" data-model-name="bookings.formtimetable" 
                value="{{item.end_time}}" data-obj-id="{{item.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/> 
                <span id="end_time__msg"></span>
        </div>
        <div class="col-3 text-end">
            <a class="ark" data-url="{%url 'form-remove-timetable'%}" data-target="div-emails-{{obj.id}}" data-obj_id="{{item.id}}">
                {%trans "Remove"%}</a>
        </div>
    {% endfor %}

</div>

<script> 
    var toolbarOptions = [
        ['bold', 'italic', 'underline', 'strike'],        // toggled buttons
        ['blockquote', 'code-block'],

        [{ 'header': 1 }, { 'header': 2 }],               // custom button values
        [{ 'list': 'ordered'}, { 'list': 'bullet' }],
        [{ 'script': 'sub'}, { 'script': 'super' }],      // superscript/subscript
        [{ 'indent': '-1'}, { 'indent': '+1' }],          // outdent/indent
        [{ 'direction': 'rtl' }],                         // text direction

        [{ 'size': ['small', false, 'large', 'huge'] }],  // custom dropdown
        [{ 'header': [1, 2, 3, 4, 5, 6, false] }],
        [ 'link', 'image', 'video', 'formula' ],          // add's image support
        [{ 'color': [] }, { 'background': [] }],          // dropdown with defaults from theme
        [{ 'font': [] }],
        [{ 'align': [] }],

        ['clean']                                         // remove formatting button
    ];


    var quill_tt = new Quill('#t-desc-editor', { modules: { toolbar: toolbarOptions }, theme: 'snow' });
    quill_tt.on('text-change', function(delta, oldDelta, source) {
        $("#t-desc").html(quill_tt.root.innerHTML);
        $("#t-desc").change();
    });
</script>
