{% load i18n padword_tags %}

{% for f in q.field_set.all %}
    <div class="row">
        <div class="col-1">
            <input type="text" class="form-control autosave" id="f-order" name="order" value="{{f.order}}" title="{{f.order}}" 
                data-model-name="bookings.field" data-obj-id="{{f.id}}" data-url="{% url "autosave_field" %}" 
                data-target="div-notification"/> <span id="f-order__msg"></span>
        </div>

        <div class="col-6">
            <input type="text" class="form-control autosave" id="f-text" name="text" value="{% padword_translate f.text %}" 
                title="{% padword_translate f.text %}" data-model-name="bookings.field" data-obj-id="{{f.id}}" data-url="{% url "autosave_field" %}" 
                data-lang="{% current_lang %}" data-target="div-notification"/> <span id="f-text__msg"></span>
        </div>

        <div class="col-4">
            <select name="answer_type" id="answer_type" class="form-control autosave" data-model-name="bookings.field" 
                data-obj-id="{{f.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification">
                <option value="">-- {% trans "Select field type" %} --</option>
                {% for item in answer_type_list %}
                    <option value="{{item.id}}" {%if item == f.answer_type %}selected{%endif%}>{{item.text}}</option>
                {% endfor %}
            </select> <span id="form_type__msg"></span>
        </div>

        <div class="col-1">
            <a href="#" class="ark" data-url="{% url "field-remove" %}" data-target="div-question-{{q.id}}" data-obj_id="{{f.id}}" 
                title="{% trans "Add item"%}" data-confirm="{% trans "Are you sure to remove this item?" %}"><i class="fas fa-trash"></i></a>  
        </div>
    </div>
{% endfor %}
