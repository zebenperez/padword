{% load i18n %}

<div class="row justify-center p-0" tyle="border:2px solid blue !important">
	<div class="col-6">
		<label class="label">{% trans "Card Number" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="number" name="number" value="" 
            data-model-name="guest.guestcard" data-obj-id="{{card.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span class="msg_error" id="number__msg"></span>
	</div>
	<div class="col-3">
		<label class="label">{% trans "Expire Date" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="date" name="date" value=""  placeholder="mm/yyyy"
            data-model-name="guest.guestcard" data-obj-id="{{card.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span class="msg_error" id="date__msg"></span>
	</div>
	<div class="col-3">
		<label class="label">{% trans "CVC" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="code" name="code" value="" 
            data-model-name="guest.guestcard" data-obj-id="{{card.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span class="msg_error" id="date__msg"></span>
	</div>
</div>
