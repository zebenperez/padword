{% load i18n %}


<div class="row justify-center">
    <div class="col-3"> {{item.name}} </div>

	<div class="col-4">
		<label class="label">{% trans "Time to start (previous checkin)" %}:</label>
		<input type="time" class="form-control autosave input mb-4" id="start_time" name="start_time" value="{{item.start_time}}" 
            title="{{item.start_time}}" data-model-name="guest.sensibodevice" data-obj-id="{{item.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span class="msg_error" id="start_time__msg"></span>
	</div>

	<div class="col-1">
		<label class="label">{% trans "Mode" %}:</label>
        <select class="form-control autosave input mb-4" id="mode" name="mode" data-model-name="guest.sensibodevice" data-obj-id="{{item.id}}"
            data-url="{% url "autosave_field" %}" data-target="div-notification">
            <option value="cool" {%if item.mode == "cool"%}selected{%endif%}>{% trans "Cool" %}</option>
            <option value="heat" {%if item.mode == "heat"%}selected{%endif%}>{% trans "Heat" %}</option>
            <option value="fan" {%if item.mode == "fan"%}selected{%endif%}>{% trans "Fan" %}</option>
            <option value="dry" {%if item.mode == "dry"%}selected{%endif%}>{% trans "Dry" %}</option>
            <option value="auto" {%if item.mode == "auto"%}selected{%endif%}>{% trans "Auto" %}</option>
        </select><span class="msg_error" id="mode__msg"></span>
	</div>

	<div class="col-2">
        <label class="label">{% trans "Temperature" %}: </label>
        <select class="form-control autosave input mb-4" id="temp" name="temp" data-model-name="guest.sensibodevice" data-obj-id="{{item.id}}"
            data-url="{% url "autosave_field" %}" data-target="div-notification">
            {% for temp in temp_range %}
                <option value="{{temp}}" {%if item.temp == temp|stringformat:"i"%}selected{%endif%}>{{temp}}</option>
            {% endfor %}
        </select><span class="msg_error" id="temp__msg"></span>
	</div>

	<div class="col-2">
		<label class="label">{% trans "Level" %}:</label>
        <select class="form-control autosave input mb-4" id="level" name="level" data-model-name="guest.sensibodevice" data-obj-id="{{item.id}}"
            data-url="{% url "autosave_field" %}" data-target="div-notification">
            <option value="low" {%if item.level == "low"%}selected{%endif%}>{% trans "Low" %}</option>
            <option value="medium" {%if item.level == "medium"%}selected{%endif%}>{% trans "Medium" %}</option>
            <option value="high" {%if item.level == "high"%}selected{%endif%}>{% trans "High" %}</option>
            <option value="auto" {%if item.level == "auto"%}selected{%endif%}>{% trans "Auto" %}</option>
        </select><span class="msg_error" id="level__msg"></span>
	</div>
</div>
