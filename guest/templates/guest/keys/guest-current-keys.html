{% load i18n %}

<div class="card">
    <div class="card-header"> {% trans "Current locks asigned" %} </div>

    <div class="card-body">
        {% for item in obj.keys.all %}
            <div class="row" id="row_{{item.id}}">
                <div class="col-10">{{item.lock}}</div>
                <div class="col-2 text-right">
                    <a class="btn btn-sm autoremove" data-model-name="guest.key" data-obj-id="{{item.id}}" data-url="{% url "autoremove_obj" %}" 
                        data-target="row_{{item.id}}" data-confirm="{%trans "Are you sure to remove this element?"%}"><i class="fas fa-trash"></i></a>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
