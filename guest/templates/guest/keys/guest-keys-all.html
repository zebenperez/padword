{% load i18n padword_tags %}

<style> .back-grey{background:#ccc} </style>


<div class="row w-100 common-modal-head m-0 p-0">
    <div class="col-11"><h2>{% trans 'Add card' %}</h2></div>
    <div class="col-1 text-center"><button type="button" class="btn btn-sm" data-bs-dismiss="modal"><i class="fas fa-times"></i></button> </div>
</div>

<div id="div-return" class="hide"></div>

<div id="div-main">
    <div class="row justify-center notification-popup">
        <div class="col-12 mb-2">
            <label class="label">{% trans "Card number" %}:</label>
            <input type="text" class="form-control input mb-1" id="number" name="number" onchange="$('#btn-save').data('value', $(this).val())"/>
        </div>
    </div>

    <div class="d-flex justify-content-end p-2">
        <button type="button" id="btn-save" class="btn btn-primary ark m-2" data-url="{% url "guest-key-add-card-all" %}" 
            data-target="div-return" data-obj_id="{{obj.id}}" data-value="" 
            onclick="$('#div-main').hide(); $('#div-return').show()"> {%trans "Add"%} </button>
        <button type="button" class="btn btn-primary m-2" data-bs-dismiss="modal"> {% trans "Cancel" %}</button>
    </div>
</div>
