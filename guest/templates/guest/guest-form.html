{% load i18n %}

<h2>{% trans 'New guest' %}</h2>


<span id="div-notification"></span><br/>

<div class="row justify-center">
	<div class="col-sm-6 col-md-5 col-12">
		{% trans "PID" %}:
		<input type="text" class="form-control autosave b-bottom mb-4" id="pid" name="pid" value="{{obj.PID}}" title="{{obj.PID}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="pid__msg"></span>
	</div>

	<div class="col-sm-6 col-md-5 col-12">
		{% trans "UUID" %}:
		<input type="text" class="form-control autosave b-bottom mb-4" id="uuid" name="uuid" value="{{obj.UUID}}" title="{{obj.UUID}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="uuid__msg"></span>
	</div>

	<div class="col-sm-6 col-md-5 col-12">
		{% trans "Name" %}:
		<input type="text" class="form-control autosave b-bottom mb-4" id="name" name="name" value="{{obj.name}}" title="{{obj.name}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="name__msg"></span>
	</div>

	<div class="col-sm-6 col-md-5 col-12">
		{% trans "Surname" %}:
		<input type="text" class="form-control autosave b-bottom mb-4" id="surname" name="surname" value="{{obj.surname}}" title="{{obj.surname}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="surname__msg"></span>
	</div>

	<div class="col-sm-6 col-md-5 col-12">
		{% trans "Room" %}:
		<input type="text" class="form-control autosave b-bottom mb-4" id="room" name="room" value="{{obj.room}}" title="{{obj.room}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="room__msg"></span>
	</div>

	<div class="col-sm-6 col-md-5 col-12">
		{% trans "Languaje" %}:
		<input type="text" class="form-control autosave b-bottom mb-4" id="languaje" name="language" value="{{obj.language}}" 
            title="{{obj.language}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="language__msg"></span>
	</div>

	<div class="col-sm-12 col-md-12 col-12">
		{% trans "Project UUID" %}:
		<input type="text" class="form-control autosave b-bottom mb-4" id="project_id" name="project_id" value="{{obj.project_id}}" 
            title="{{obj.project_id}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="project__msg"></span>
	</div>

	<div class="col-sm-6 col-md-5 col-12">
		{% trans "Check-in" %}:
		<input type="date" class="form-control autosave b-bottom mb-4" id="check_in" name="check_in" value="{{obj.check_in|date:"Y-m-d"}}" 
            title="{{obj.check_in}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="check_in__msg"></span>
	</div>

	<div class="col-sm-6 col-md-5 col-12">
		{% trans "Check-out" %}:
		<input type="date" class="form-control autosave b-bottom mb-4" id="check_out" name="check_out" value="{{obj.check_out|date:"Y-m-d"}}" 
            title="{{obj.check_out}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="check_out__msg"></span>
	</div>
</div>

<div class="d-flex justify-content-end">
	<button type="button" class="btn btn-sm ark save" data-bs-dismiss="modal" data-url="{% url "guest-search" %}" 
        data-target="guest-list">{% trans "Save" %}</button>
	<button type="button" class="btn btn-sm ark cancel" data-bs-dismiss="modal" data-url="{% url "guest-remove" %}" data-target="guest-list" 
        data-obj_id="{{obj.id}}" data-confirm="{% trans "Are you sure to remove this element?" %}">{% trans "Remove" %}</button>
</div>
