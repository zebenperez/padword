{% load i18n %}

<h2 class="common-modal-head">{% trans 'New guest' %}</h2>


<span id="div-notification"></span><br/>

<div class="row justify-center">
	<div class="col-6">
        <label class="label">{% trans "Name" %}*:</label>
		<input type="text" class="form-control autosave input mb-4" id="name" name="name" value="{{obj.name}}" title="{{obj.name}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification" required/>
			<span id="name__msg"></span>
	</div>

	<div class="col-6">
	    <label class="label">{% trans "Surname" %}*:</label>
		<input type="text" class="form-control autosave input mb-4" id="surname" name="surname" value="{{obj.surname}}" title="{{obj.surname}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification" required/>
			<span id="surname__msg"></span>
	</div>

	<div class="col-6">
		<label class="label">{% trans "Check-in" %}*:</label>
		<input type="date" class="form-control autosave input mb-4" id="check_in" name="check_in" value="{{obj.check_in|date:"Y-m-d"}}" 
            title="{{obj.check_in}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification" required/> <span id="check_in__msg"></span>
	</div>

	<div class="col-6">
		<label class="label">{% trans "Check-out" %}*:</label>
		<input type="date" class="form-control autosave input mb-4" id="check_out" name="check_out" value="{{obj.check_out|date:"Y-m-d"}}" 
            title="{{obj.check_out}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification" required/> <span id="check_out__msg"></span>
	</div>

	<div class="col-6">
		<label class="label">{% trans "Room" %}*:</label>
		<input type="text" class="form-control autosave input mb-4" id="room" name="room" value="{{obj.room}}" title="{{obj.room}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification" required/>
			<span id="room__msg"></span>
	</div>

	<div class="col-6">
		<label class="label">{% trans "Guest type" %}*:</label>
	</div>

	<div class="col-6">
		<label class="label">{% trans "Confirm code" %}*:</label>
		<input type="text" class="form-control autosave input mb-4" id="pin" name="pin" value="{{obj.pin}}" 
            title="{{obj.pin}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification" required/> <span id="room__msg"></span>
	</div>

	<div class="col-6">
		<label class="label">{% trans "Country" %}*:</label>
	</div>

	<div class="col-6">
		<label class="label">{% trans "Languaje" %}*:</label>
		<input type="text" class="form-control autosave input mb-4" id="languaje" name="language" value="{{obj.language}}" 
            title="{{obj.language}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="language__msg"></span>
	</div>

	<div class="col-6">
		<label class="label">{% trans "Born date" %}:</label>
		<input type="date" class="form-control autosave input mb-4" id="birthdate" name="birthdate" value="{{obj.birthdate|date:"Y-m-d"}}" 
            title="{{obj.birthdate}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="birthdate__msg"></span>
	</div>

	<div class="col-3">
		<label class="label">{% trans "Married" %}:</label>
        <select class="form-control autosave input mb-4" id="married" name="married" data-model-name="guest.guest" data-obj-id="{{obj.id}}"
            data-url="{% url "autosave_field" %}" data-target="div-notification">
            <option value="0" {%if obj.married == 0%}selected{%endif%}>{% trans "NO" %}</option>
            <option value="1" {%if obj.married == 1%}selected{%endif%}>{% trans "YES" %}</option>
        </select><span id="married__msg"></span>
	</div>

	<div class="col-3">
		<label class="label">{% trans "Children" %}:</label>
        <select class="form-control autosave input mb-4" id="with_kids" name="with_kids" data-model-name="guest.guest" data-obj-id="{{obj.id}}"
            data-url="{% url "autosave_field" %}" data-target="div-notification">
            <option value="0" {%if obj.with_kids == 0%}selected{%endif%}>{% trans "NO" %}</option>
            <option value="1" {%if obj.with_kids == 1%}selected{%endif%}>{% trans "YES" %}</option>
        </select><span id="with_kids__msg"></span>
	</div>

	<div class="col-2">
		<label class="label">{% trans "Adults" %}:</label>
		<input type="number" class="form-control autosave input mb-4" id="adults" name="adults" value="{{obj.adults}}" 
            title="{{obj.adults}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="adults__msg"></span>
	</div>

	<div class="col-2">
		<label class="label">{% trans "Children" %}:</label>
		<input type="number" class="form-control autosave input mb-4" id="children" name="children" value="{{obj.children}}" 
            title="{{obj.children}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="children__msg"></span>
	</div>

	<div class="col-2">
		<label class="label">{% trans "Babies" %}:</label>
		<input type="number" class="form-control autosave input mb-4" id="babies" name="babies" value="{{obj.babies}}" 
            title="{{obj.babies}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="babies__msg"></span>
	</div>

    {# ------------ ROW 4 --------------#}
	<div class="col-3 col-md-6 col-sm-12">
		<label class="label">{% trans "Mobile phone" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="mobile" name="mobile" value="{{obj.mobile|default:""}}" 
            title="{{obj.mobile}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="mobile__msg"></span>
	</div>

	<div class="col-3 col-md-6 col-sm-12">
		<label class="label">{% trans "Email" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="email" name="email" value="{{obj.email|default:""}}" 
            title="{{obj.email}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span id="email__msg"></span>
	</div>

	<div class="col-3 col-md-6 col-sm-12">
		<label class="label">{% trans "UUID" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="uuid" name="uuid" value="{{obj.UUID}}" title="{{obj.UUID}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification" readonly/>
			<span id="uuid__msg"></span>
	</div>

	<div class="col-3 col-md-6 col-sm-12">
		<label class="label">{% trans "PID" %}:</label>
		<input type="text" class="form-control autosave input  mb-4" id="pid" name="pid" value="{{obj.PID}}" title="{{obj.PID}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span id="pid__msg"></span>
	</div>

    {# ------------ ROW 5 --------------#}
	<div class="col-3 col-md-6 col-sm-12">
		<label class="label">{% trans "Project UUID" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="project_id" name="project_id" value="{{obj.project_id}}" 
            title="{{obj.project_id}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification" required/> <span id="project__msg"></span>
	</div>

	<div class="col-3 col-md-6 col-sm-12">
        <label class="label">{% trans "Deleted" %}:</label>
        <select class="form-control autosave input mb-4" id="deleted" name="deleted" data-model-name="guest.guest" data-obj-id="{{obj.id}}"
            data-url="{% url "autosave_field" %}" data-target="div-notification">
            <option value="0" {%if obj.deleted == 0%}selected{%endif%}>{% trans "NO" %}</option>
            <option value="1" {%if obj.deleted == 1%}selected{%endif%}>{% trans "YES" %}</option>
        </select><span id="married__msg"></span>

	</div>
</div>

<div class="d-flex justify-content-end p-2">
	<button type="button" class="btn btn-primary ark m-2" data-bs-dismiss="modal" data-url="{% url "guest-search" %}" 
        data-target="guest-list">{% trans "Save" %}</button>
	<button type="button" class="btn btn-danger ark m-2" data-bs-dismiss="modal" data-url="{% url "guest-remove" %}" data-target="guest-list" 
        data-obj_id="{{obj.id}}" data-confirm="{% trans "Are you sure to remove this element?" %}">{% trans "Remove" %}</button>
</div>
