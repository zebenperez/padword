{% load i18n %}


<span id="div-notification"></span><br/>

<div class="row justify-center">
	<div class="col-5 mb-4">
        <label class="label">{% trans "Amount" %}:</label>
        <input type="text" class="form-control autosave input mb-1" id="amount" name="amount" value="{{obj.amount}}" 
            title="" data-model-name="guest.wristbandbalance" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span class="msg_error" id="amount__msg"></span>
	</div>

	<div class="col-5">
		<label class="label">{% trans "Date" %}:</label>
		<input type="date" class="form-control autosave input mb-4" id="date" name="date" value="{{obj.date|date:"Y-m-d"}}" 
            title="" data-model-name="guest.wristbandbalance" data-obj_id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification"/> <span class="msg_error" id="date__msg"></span>
	</div>
	<div class="col-2">
        <button type="button" class="btn btn-primary ark m-2" data-url="{% url "guest-band-balance-list" %}" data-target="band-{{obj.wristband.id}}" 
            data-obj_id="{{obj.wristband.id}}">{%trans "Save"%}</button>
    </div>
</div>
