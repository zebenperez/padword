{% load i18n padword_tags %}

<div class="row w-100 common-modal-head m-0 p-0">
    <div class="col-11"><h2>{% trans 'Wristband balance' %}</h2></div>
    <div class="col-1"><button type="button" class="btn btn-sm" data-bs-dismiss="modal"><i class="fas fa-times"></i></button> </div>
</div>

<span id="div-notification"></span><br/>

<div class="card pb-3">
    <div class="row m-0">
        {% for band in obj.bands.all %}
            <div class="col-12">
                <div class="card">
                    <div class="card-header toggle-btn" data-target="band-{{band.id}}" data-id-change="icon-extra" 
                        data-text='<i class="fas fa-plus"></i>' data-text-alt='<i class="fas fa-minus"></i>'>
                        <div class="row w-100">
                            <div class="col-6 text-right" id="icon-extra"><i class="fas fa-plus"></i></div>
                            <div class="col-6 text-left"><strong>{{band.code}}</strong></div>
                        </div>
                    </div>
                    <div class="card-body hide" id="band-{{band.id}}"> {% include "guest/bands/balance.html" %} </div>
                </div>
            </div>
        {% endfor %}
    </div>
</div>
