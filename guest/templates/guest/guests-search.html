{% load i18n padword_tags %}

<div class="row m-0 p-2">
    <div class="col-2 rounded-pill-btn text-center pointer p-1" onclick="$('#toolbar-search').slideToggle()">{% trans "Filters" %} <i class="fas fa-search"></i></div>
</div>

<div id="toolbar-search" class="toolbar-search- guests p-2 hide" style="display:none">
    <form class="form" method="GET" action="{% url "lock-search" %}" id="form-search">
        {%csrf_token%}
        <div class="row">
            <div class="col-3"> <i class="fas fa-search"></i>
                <input type="text" class="form-control form-control-dark" name="gs_name" id="gs_name" 
                    placeholder="{% trans 'Name, Surname, Email or Phone' %}"  value="{{request.session.gs_name}}"/>
            </div>
            <div class="col-2">
                <input type="text" class="form-control form-control-dark" name="gs_room" id="gs_room" placeholder="{% trans 'Room' %}" 
                    value="{{request.session.gs_room}}"/>
            </div>
            <div class="col-2">
                <input type="text" class="form-control form-control-dark" name="gs_lang" id="gs_lang" placeholder="{% trans 'Language' %}" 
                    value="{{request.session.gs_lang}}"/>
            </div>
            <div class="col-2">
                <input type="text" class="form-control form-control-dark" name="gs_ext_id" id="gs_ext_id" placeholder="{% trans 'ID External' %}" 
                    value="{{request.session.gs_ext_id}}"/>
            </div>
            <div class="col-3">
                <select class="form-control form-control-dark w-100 select-k guests" name="gs_project" id="gs_project">
                    <option value="">{% trans "-- Select project ---" %}</option>
                    {% for proj in project_list %} <option value="{{proj.uuid}}">{{proj.name}}</option> {% endfor %}
                </select>
            </div>
            </div>
        <div class="row">
            <div class="col-3">
                <input type="date" class="form-control form-control-dark" name="gs_ini_date" id="gs_ini_date"
                    value="{{request.session.gs_ini_date|date:'Y-m-d'}}"/>
            </div>
            <div class="col-3">
                <input type="date" class="form-control form-control-dark" name="gs_end_date" id="gs_end_date"
                    value="{{request.session.gs_end_date|date:'Y-m-d'}}"/>
            </div>
            <div class="col-3">
                <input type="date" class="form-control form-control-dark" name="gs_ini_date_end" id="gs_ini_date_end" 
                    value="{{request.session.gs_ini_date_end|date:'Y-m-d'}}"/>
            </div>
            <div class="col-3">
                <input type="date" class="form-control form-control-dark" name="gs_end_date_end" id="gs_end_date_end" 
                    value="{{request.session.gs_end_date_end|date:'Y-m-d'}}"/>
            </div>
        </div>
        <div class="row"><div class="col-6 offset-3">
            <button class="btn btn-primary mt-2 saveform w-100" data-form="form-search" data-target="guest-list">
                <i class="fas fa-plus"></i> {% trans "Search" %}</button> 
        </div></div>
    </form>
</div>
