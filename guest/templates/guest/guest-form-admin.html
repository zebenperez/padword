{% load i18n %}

<div class="row justify-center">
    {# ------------ ROW 4 --------------#}
	<div class="col-3 col-md-6 col-sm-12">
		<label class="label">{% trans "UUID" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="uuid" name="uuid" value="{{obj.UUID}}" title="{{obj.UUID}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification" readonly/>
			<span class="msg_error" id="uuid__msg"></span>
	</div>

	<div class="col-3 col-md-6 col-sm-12">
		<label class="label">{% trans "PID" %}:</label>
		<input type="text" class="form-control autosave input  mb-4" id="pid" name="pid" value="{{obj.PID}}" title="{{obj.PID}}" 
			data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" data-target="div-notification"/>
			<span class="msg_error" id="pid__msg"></span>
	</div>

    {# ------------ ROW 5 --------------#}
	<div class="col-3 col-md-6 col-sm-12">
		<label class="label">{% trans "Project UUID" %}:</label>
		<input type="text" class="form-control autosave input mb-4" id="project_id" name="project_id" value="{{obj.project_id}}" 
            title="{{obj.project_id}}" data-model-name="guest.guest" data-obj-id="{{obj.id}}" data-url="{% url "autosave_field" %}" 
            data-target="div-notification" {%if project_uuid%}readonly{%endif%}/> <span class="msg_error" id="project_id__msg"></span>
	</div>

	<div class="col-3 col-md-6 col-sm-12">
        <label class="label">{% trans "Deleted" %}:</label>
        <select class="form-control autosave input mb-4" id="deleted" name="deleted" data-model-name="guest.guest" data-obj-id="{{obj.id}}"
            data-url="{% url "autosave_field" %}" data-target="div-notification">
            <option value="0" {%if obj.deleted == 0%}selected{%endif%}>{% trans "NO" %}</option>
            <option value="1" {%if obj.deleted == 1%}selected{%endif%}>{% trans "YES" %}</option>
        </select><span class="msg_error" id="married__msg"></span>

	</div>
</div>
