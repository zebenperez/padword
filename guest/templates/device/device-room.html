{% load i18n %}

<h2>{% trans 'New guest' %}</h2>


<span id="div-notification"></span><br/>

<div class="row justify-center">

	<div class="col-3">
		{% trans "Room" %}:
        <select class="form-control autosave b-bottom mb-4" id="room" name="room" data-model-name="web.device" data-obj-id="{{obj.id}}"
            data-url="{% url "autosave_field" %}" data-target="div-notification">
            <option value="">{% trans "-- Select room --" %}</option>
            {% for item in item_list %}
                <option value="{{item.room}}" {%if obj.room == item.room%}selected{%endif%}>{{item.room}}</option>
            {% endfor %}
        </select><span id="room__msg"></span>
	</div>

</div>

<div class="d-flex justify-content-end">
	<button type="button" class="btn btn-sm ark save" data-bs-dismiss="modal" data-url="{% url "guest-device-search" %}" 
        data-target="guest-list">{% trans "Save" %}</button>
</div>
