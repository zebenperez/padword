{% extends 'base.html' %}
{% load i18n padword_tags %}

{% block second_menu %}{% get_second_menu request.user %} {% endblock second_menu %}

{% block central_content %}

    <div class="toolbar-search">
        <div class="row key-number p-2">
            <div class="row col-6 left-k pt-2 pb-2">
                <div class="col-4 left-cardnumber">{% trans "Band number" %}:</div>
                <div class="col-8">
                    <input type="text" class="form-control input-k w-100 ark_change" name="number" id="number"
                        placeholder="{% trans 'Click here and then place the card on the reader' %}" data-url="{% url "wristbands-search" %}" 
                        data-target="bands-result" onchange="setNumbers($(this))"/>
                </div>
            </div>
            <div class="col-5 offset-1 right-k p-2">
                <div class="">{% trans "Current band number" %}:</div>
                <div class="text-end"><strong><span id="current-card"></span></strong></div>
            </div>
        </div>
    </div>

    <div id="bands-result"> </div>

    <script> function setNumbers(obj){ setTimeout(()=>{obj.val('')}, 200); } </script>
{% endblock central_content %}
