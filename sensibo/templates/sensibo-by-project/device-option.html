
<li>
    <a class="ark" 
        data-url="{% url "sensibo-device-set-state-project" %}" 
        data-target="row_{{item.uid}}" 
        data-obj_id="{{project.id}}" 
        data-name="{{item.name}}"
        data-uid="{{item.uid}}" 
        data-param="{{param}}" 
        data-value="{{value}}">
            {% if cvalue == value %} 
                <span class="actual">{{value}}</span>
            {% else %}
                {{value}}
            {% endif %} 
    </a>
</li>
