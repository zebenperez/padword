{% load i18n padword_tags %}

<div class="col-12 btn-tools text-right mb-2">
    {% if cat %}
    <a class="btn btn-primary ark" data-url="{% url "form-form" %}" data-target-modal="common-modal" data-company_id="{{cat.company.id}}" data-category_id="{{cat.uuid}}" title="{% trans "New form" %}"><i class="fab fa-wpforms"></i></a>  
    <a class="btn btn-primary ark" href="#" data-url="{% url 'change-active-category' cat.uuid %}" data-target="row-{{cat.pk}}" title="{% if cat.active %}{% trans 'Deactivate' %}{%else%}{%trans 'Activate'%}{%endif%}"><i class="text-white fas fa-{% if cat.active %}times{%else%}check{%endif%}"></i></a>
    <a class="btn btn-primary ark" data-url="{% url "category-form" %}" data-target-modal="common-modal" data-parent-id="{{cat.uuid}}" href="#" title="{% trans 'Add category' %}"><i class="text-white fas fa-folder-plus"></i></a>
    <a class="btn btn-primary ark" href="#" title="{% trans 'Add item' %}" data-target="div-none" data-url="#" data-confirm="Coming soon!!!"><i class="text-white fas fa-plus-square"></i></a>
    <a class="btn btn-primary ark" data-url="{% url "category-form" %}" data-target-modal="common-modal" data-obj-id="{{cat.uuid}}" href="#" title="{% trans 'Modify this category' %}"><i class="text-white fas fa-edit"></i></a>
    <a class="btn btn-primary ark" href="#" data-url="{% url 'category-remove' cat.uuid %}" data-target="items-list-{{cat.parent.pk}}" title="{% trans 'Delete' %}" data-confirm="{% trans "Are you sure to remove this element?" %}"><i class="text-white fas fa-trash"></i></a>
    {%else %}
    <a class="btn btn-primary ark" data-url="{% url "category-form" %}" data-target-modal="common-modal" data-project-id="{{project.uuid}}" href="#" title="{% trans 'Add category' %}"><i class="text-white fas fa-folder-plus"></i>&nbsp; {% trans 'New category' %}</a>
    {% endif %}
</div>

{% for item in items %}
<div class="row category p-2" id="row-{{item.id}}">
    {% include "contents/category-row.html" with item=item %}
</div>
{% endfor %}
