{% load i18n padword_tags %}

<table class="table table-striped table-hover">
    <thead>
        <tr class="small small">
            <th> {% trans 'Nombre' %}</th>
            <th> {% trans 'Rango' %} </th>
            <th colspan="2"> {% trans 'Activo' %} </th>
        </tr>
    </thead>
    <tbody>
        {% for item in items %}
        <tr class="small" id="row_{{item.id}}">
            <td>{% padword_translate item.name %}</td>
            <td>{{ item.rank }}</td>
            <td>{% if item.is_active == 1 %}<i class="text-success fas fa-check-circle"></i>{% else %}<i class="text-danger fas fa-times-circle"></i>{% endif%}</td>
            <td class="">
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
<script>$('#items-counter').html('{{items|length}}');</script>
