{% load padword_tags %}
<table class="table">
    {% for item in cat.get_items %}
    <tr>
        <td>{% padword_translate item.name %}</td>
        <td>{{item.price|currency}}</td>
    </tr>
    {% endfor %}
</table>
{% if cat.get_childrens|length > 0 %}
{% include "contents/categories-list.html" with items=cat.get_childrens %}
{% endif %}
<script>
    $('#btn-show-{{cat.pk}}').addClass('d-none');
    $('#btn-hide-{{cat.pk}}').removeClass('d-none');
</script>
